        {/* Keywords */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, color:C.textMid, fontFamily:"'Source Code Pro',monospace", marginBottom:7, letterSpacing:"0.07em" }}>JOB TITLE / KEYWORDS</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:8 }}>
            {KEYWORD_PRESETS.map(kw => (
              <button key={kw} onClick={() => setKeywords(kw)}
                style={{ background:keywords===kw?`linear-gradient(135deg,${C.gold},${C.goldDark})`:"transparent", border:`1px solid ${keywords===kw?C.gold:C.border}`, borderRadius:14, padding:"5px 12px", fontFamily:"'Source Code Pro',monospace", fontSize:11, color:keywords===kw?C.bg:C.textDim, cursor:"pointer", transition:"all 0.15s" }}>
                {kw}
              </button>
            ))}
          </div>
          <input value={keywords} onChange={e => setKeywords(e.target.value)}
            placeholder="Or type custom keywords..."
            style={{ ...S.input }} />
        </div>

        {/* Location */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
          <div>
            <div style={{ fontSize:10, color:C.textMid, fontFamily:"'Source Code Pro',monospace", marginBottom:6, letterSpacing:"0.07em" }}>LOCATION</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom:7 }}>
              {LOCATIONS.map(loc => (
                <button key={loc} onClick={() => { setLocation(loc); setCustomLocation(""); }}
                  style={{ background:(location===loc&&!customLocation)?C.gold+"20":"transparent", border:`1px solid ${location===loc&&!customLocation?C.gold:C.border}`, borderRadius:12, padding:"4px 10px", fontFamily:"'Source Code Pro',monospace", fontSize:10, color:location===loc&&!customLocation?C.goldLight:C.textDim, cursor:"pointer", transition:"all 0.15s" }}>
                  {loc}
                </button>
              ))}
            </div>
            <input value={customLocation} onChange={e => setCustomLocation(e.target.value)}
              placeholder="Or type any city — e.g. Glasgow, Dublin..."
              style={{ ...S.input }} />
          </div>
          <div>
            <div style={{ fontSize:10, color:C.textMid, fontFamily:"'Source Code Pro',monospace", marginBottom:6, letterSpacing:"0.07em" }}>SALARY RANGE (£)</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <input value={minSalary} onChange={e => setMinSalary(e.target.value)} placeholder="Min e.g. 35000" style={{ ...S.input }} />
              <input value={maxSalary} onChange={e => setMaxSalary(e.target.value)} placeholder="Max e.g. 70000" style={{ ...S.input }} />
            </div>
          </div>
        </div>

        {/* Toggles */}
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:16 }}>
          {[
            { label:"Permanent", val:permanent, set:setPermanent },
            { label:"Contract", val:contract, set:setContract },
            { label:"Full Time", val:fullTime, set:setFullTime },
            { label:"Part Time", val:partTime, set:setPartTime },
          ].map(t => (
            <button key={t.label} onClick={() => t.set(!t.val)}
              style={{ background:t.val?C.gold+"20":"transparent", border:`1px solid ${t.val?C.gold:C.border}`, borderRadius:14, padding:"7px 16px", fontFamily:"'Source Code Pro',monospace", fontSize:11, color:t.val?C.goldLight:C.textDim, cursor:"pointer", transition:"all 0.15s" }}>
              {t.val ? "✓ " : ""}{t.label}
            </button>
          ))}

          {/* Visa toggle — prominent */}
          <button onClick={() => setVisaOnly(!visaOnly)}
            style={{ background:visaOnly?C.green+"25":"transparent", border:`2px solid ${visaOnly?C.green:C.border}`, borderRadius:14, padding:"7px 16px", fontFamily:"'Source Code Pro',monospace", fontSize:11, color:visaOnly?C.green:C.textDim, cursor:"pointer", transition:"all 0.15s", fontWeight:visaOnly?700:400 }}>
            {visaOnly ? "✅ Visa Sponsorship Only" : "⚪ Include Visa Sponsored"}
          </button>
        </div>

        {/* Open All button */}
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <button onClick={openAll}
            style={{ background:`linear-gradient(135deg,${C.gold},${C.goldDark})`, color:C.bg, border:"none", borderRadius:8, padding:"12px 28px", fontFamily:"'Source Code Pro',monospace", fontSize:13, fontWeight:700, cursor:"pointer", letterSpacing:"0.05em", boxShadow:`0 4px 20px ${C.gold}30` }}>
            🔍 Search All Job Boards
          </button>
          <div style={{ fontSize:11, color:C.textDim, fontFamily:"'Source Code Pro',monospace" }}>
            Opens {visaOnly ? "visa-sponsored" : "all"} {keywords} jobs in {finalLocation || "UK"} across all boards
          </div>
        </div>
      </div>

      {/* Job Board Cards */}
      <div style={{ marginBottom:14 }}>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:16, color:C.text, marginBottom:4 }}>Search Individual Job Boards</div>
        <div style={{ fontSize:11, color:C.textDim, fontFamily:"'Source Code Pro',monospace", marginBottom:14 }}>Click any board to open your search — results open in a new tab with your filters applied</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
          {JOB_BOARDS.filter(b => {
            if (visaOnly && b.name === "Reed") return false;
            if (!visaOnly && b.name === "Reed (Visa Sponsored)") return false;
            return true;
          }).map(board => {
            const url = board.getUrl(keywords, finalLocation, opts);
            return (
              <a key={board.name} href={url} target="_blank" rel="noopener noreferrer"
                style={{ ...S.card, display:"block", textDecoration:"none", borderColor:board.color+"40", borderLeft:`4px solid ${board.color}`, transition:"all 0.2s", padding:"16px 18px" }}
                onMouseEnter={e => e.currentTarget.style.borderColor = board.color}
                onMouseLeave={e => e.currentTarget.style.borderColor = board.color+"40"}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                  <span style={{ fontSize:22 }}>{board.logo}</span>
                  <div>
                    <div style={{ fontFamily:"'Playfair Display',serif", fontSize:14, color:C.text, fontWeight:700 }}>{board.name}</div>
                    <div style={{ fontSize:10, color:C.textDim, fontFamily:"'Source Code Pro',monospace" }}>{board.desc}</div>
                  </div>
                </div>
                <div style={{ fontSize:11, color:board.color, fontFamily:"'Source Code Pro',monospace", fontWeight:700 }}>
                  Search {keywords} in {finalLocation || "UK"} →
                </div>
                {visaOnly && (
                  <div style={{ fontSize:10, color:C.green, fontFamily:"'Source Code Pro',monospace", marginTop:4 }}>
                    ✅ Visa sponsorship filter applied
                  </div>
                )}
              </a>
            );
          })}
        </div>
      </div>

      {/* Tips */}
      <div style={{ ...S.card, borderColor:C.borderHov, background:C.bgDark }}>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:14, color:C.goldLight, marginBottom:10 }}>💡 Tips for finding visa-sponsored BA roles</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          {[
            { icon:"✅", tip:"Toggle 'Visa Sponsorship Only' to add 'visa sponsorship' to every search automatically" },
            { icon:"🔍", tip:"Search 'Business Analyst skilled worker visa' on LinkedIn for more specific results" },
            { icon:"🏢", tip:"Large banks (HSBC, Barclays, RBS) and consultancies (Deloitte, Accenture) commonly sponsor" },
            { icon:"📧", tip:"Always confirm visa sponsorship in your cover letter or before applying to save time" },
          ].map((t,i) => (
            <div key={i} style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
              <span style={{ fontSize:16, flexShrink:0 }}>{t.icon}</span>
              <div style={{ fontSize:11, color:C.textMid, fontFamily:"'Source Code Pro',monospace", lineHeight:1.6 }}>{t.tip}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}


const DEFAULT_DATA = {
  entries:[], tasks:[], calendarEvents:[], roadmapProgress:{}, techProgress:{},
  automationProgress:{}, personalJournal:[], reminders:[], startMonth:3, startYear:2026
};

const NAV = [
  { id:"journal", label:"BA Journal", icon:"📖" },
  { id:"roadmap", label:"BA Roadmap", icon:"🗺️" },
  { id:"technical", label:"Technical BA", icon:"⚙️" },
  { id:"automation", label:"Automation", icon:"🤖" },
  { id:"tasks", label:"Tasks", icon:"✅" },
  { id:"calendar", label:"Calendar", icon:"📅" },
  { id:"personal", label:"My Journal", icon:"📔" },
  { id:"reminders", label:"Reminders", icon:"🔔" },
  { id:"myroadmap", label:"My Roadmap", icon:"🗺️" },
  { id:"auditlog", label:"Audit Log", icon:"📋" },
  { id:"qrbackup", label:"QR Backup", icon:"📱" },
  { id:"ask", label:"Ask BA", icon:"💬" },
  { id:"news", label:"BA News", icon:"📰" },
  { id:"jobs", label:"BA Jobs", icon:"💼" },
  { id:"settings", label:"Settings", icon:"⚙️" },
];

function BAJournal() {
  const [active, setActive] = useState("journal");
  const [data, setData] = useState(() => { const d = loadData(); return d ? { ...DEFAULT_DATA, ...d } : DEFAULT_DATA; });
  const [notif, setNotif] = useState(null);
  const [showConfig, setShowConfig] = useState(false);
  const [auth, setAuth] = useState(() => loadAuth());
  const [theme, setTheme] = useState(() => getTheme());

  // Apply theme whenever it changes
  useEffect(() => {
    applyTheme(theme);
    // Force re-render by updating body background
    document.body.style.background = C.bg;
  }, [theme]);

  useEffect(() => { saveData(data); }, [data]);

  const update = useCallback((key, val) => setData(prev => ({ ...prev, [key]: val })), []);
  const notify = useCallback((msg, type = "success") => {
    setNotif({ msg, type });
    setTimeout(() => setNotif(null), 3200);
  }, []);

  const slotToCalMonth = useCallback((slot) => {
    const idx = (data.startMonth + slot - 1) % 12;
    const yr = data.startYear + Math.floor((data.startMonth + slot - 1) / 12);
    return { month: ALL_MONTHS[idx], monthFull: MONTH_NAMES[idx], year: yr };
  }, [data.startMonth, data.startYear]);

  const overallPct = () => {
    const total = BA_ROADMAP.reduce((s, r) => s + r.topics.length, 0);
    const done = Object.values(data.roadmapProgress).filter(Boolean).length;
    return total ? Math.round((done / total) * 100) : 0;
  };

  const handleSignOut = () => {
    // Only clear the session - keep the auth profile (name + PIN) intact
    // So Sign In page can show the PIN keypad next time
    setAuth(null);
  };

  const handleUpdateAuth = (newAuth) => {
    setAuth(newAuth);
    saveAuth(newAuth);
  };

  // Show sign in if not authenticated
  if (!auth) {
    return <SignInPage onSignIn={(a) => {
      saveAuth(a);
      // Re-read data from localStorage in case a restore just wrote new data
      const freshData = loadData();
      if (freshData) setData({ ...DEFAULT_DATA, ...freshData });
      setAuth(a);
    }} />;
  }

  const userName = auth.name || "Analyst";

  return (
    <div style={{ fontFamily: "'Georgia', serif", minHeight: "100vh", background: C.bg, color: C.text, transition: "background 0.3s, color 0.3s" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Code+Pro:wght@300;400;500;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1815; }
        ::-webkit-scrollbar-thumb { background: #5a4a2a; border-radius: 3px; }
        @keyframes fadeSlide { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .fade-in { animation: fadeIn 0.25s ease; }
        .pulse { animation: pulse 1.8s ease-in-out infinite; }
        select option { background: #191714; color: #e8e0d0; }
        a { color: inherit; }
      `}</style>

      {/* ── Header ── */}
      <div style={{ background: C.bgDark, borderBottom: `1px solid ${C.border}`, padding: "0 20px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 58, position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, background: `linear-gradient(135deg, ${C.gold}, ${C.goldDark})`, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>📋</div>
          <div>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, fontWeight: 700, color: C.goldLight }}>{userName}'s BA Journal</div>
            <div style={{ fontSize: 9, color: C.textFaint, fontFamily: "'Source Code Pro', monospace", letterSpacing: "0.1em" }}>TECHNICAL BA GROWTH TRACKER · 2026</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Btn variant="outline" sm onClick={() => setShowConfig(true)}>📅 {ALL_MONTHS[data.startMonth]} {data.startYear}</Btn>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 10, color: C.textDim, fontFamily: "'Source Code Pro', monospace" }}>{overallPct()}%</span>
            <div style={{ width: 60 }}><ProgressBar pct={overallPct()} /></div>
          </div>
          {/* Theme Switcher */}
          <div style={{ display:"flex", gap:4, alignItems:"center" }}>
            {Object.entries(THEMES).map(([key, t]) => (
              <button key={key} onClick={() => setTheme(key)} title={t.name}
                style={{ width:24, height:24, borderRadius:"50%", border: theme===key ? `2px solid ${C.goldLight}` : "2px solid transparent", background:"transparent", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.15s", transform: theme===key ? "scale(1.2)" : "scale(1)" }}>
                {t.emoji}
              </button>
            ))}
          </div>
          <div style={{ width: 30, height: 30, borderRadius: "50%", background: `linear-gradient(135deg,${C.gold},${C.goldDark})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: C.bg, cursor:"pointer", flexShrink:0 }}
            onClick={() => setActive("settings")}>
            {userName[0]?.toUpperCase()}
          </div>
        </div>
      </div>

      {showConfig && <StartConfig data={data} update={update} onClose={() => setShowConfig(false)} />}
      {notif && <Notification msg={notif.msg} type={notif.type} />}

      <div style={{ display: "flex", minHeight: "calc(100vh - 58px)" }}>
        {/* ── Sidebar ── */}
        <div style={{ width: 185, background: C.bgDark, borderRight: `1px solid ${C.border}`, padding: "16px 8px", display: "flex", flexDirection: "column", gap: 1, flexShrink: 0 }}>
          {NAV.map(n => (
            <button key={n.id} onClick={() => setActive(n.id)}
              style={{ background: "none", border: "none", cursor: "pointer", padding: "10px 12px", borderRadius: 7, display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontFamily: "'Source Code Pro', monospace", letterSpacing: "0.04em", color: active === n.id ? C.goldLight : C.textMid, background: active === n.id ? "#1c1a16" : "none", borderLeft: active === n.id ? `2px solid ${C.gold}` : "2px solid transparent", transition: "all 0.15s", width: "100%", textAlign: "left" }}>
              <span style={{ fontSize: 13 }}>{n.icon}</span>{n.label}
            </button>
          ))}
          <div style={{ marginTop: "auto", padding: "12px 4px 0", borderTop: `1px solid #1e1c18` }}>
            <div style={{ fontSize: 9.5, color: C.textFaint, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.7 }}>
              {userName} · Started {ALL_MONTHS[data.startMonth]} {data.startYear}<br/>
              {Object.values(data.roadmapProgress).filter(Boolean).length} BA topics done
            </div>
          </div>
        </div>

        {/* ── Main Content ── */}
        <div style={{ flex: 1, padding: "24px 28px", overflow: "auto" }}>
          {active === "journal"    && <JournalView data={data} update={update} notify={notify} slotToCalMonth={slotToCalMonth} />}
          {active === "roadmap"    && <RoadmapView data={data} update={update} slotToCalMonth={slotToCalMonth} />}
          {active === "technical"  && <TechnicalBAView data={data} update={update} slotToCalMonth={slotToCalMonth} />}
          {active === "automation" && <AutomationView data={data} update={update} />}
          {active === "tasks"      && <TasksView data={data} update={update} notify={notify} slotToCalMonth={slotToCalMonth} />}
          {active === "calendar"   && <CalendarView data={data} update={update} notify={notify} />}
          {active === "personal"   && <PersonalJournalView data={data} update={update} notify={notify} userName={userName} />}
          {active === "reminders"  && <RemindersView data={data} update={update} notify={notify} />}
          {active === "myroadmap"  && <CustomRoadmapView data={data} update={update} notify={notify} />}
          {active === "auditlog"   && <AuditLogView data={data} />}
          {active === "qrbackup"   && <QRBackupView data={data} setData={setData} notify={notify} />}
          {active === "ask"        && <AskBAView />}
          {active === "news"       && <NewsView />}
          {active === "jobs"       && <BAJobsView />}
          {active === "settings"   && <BackupSettingsView data={data} setData={setData} notify={notify} auth={auth} onUpdateAuth={handleUpdateAuth} onSignOut={handleSignOut} theme={theme} setTheme={setTheme} />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(BAJournal));

  </script>
</body>
</html>
