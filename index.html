const THEME_KEY = "ba_theme_v9";
function getTheme() {
  try { const t = localStorage.getItem(THEME_KEY); return (t && THEMES[t]) ? t : "default"; } catch { return "default"; }
}

// C is always the current theme - components read from C
let C = THEMES[getTheme()];
function applyTheme(themeName) {
  if (THEMES[themeName]) {
    C = THEMES[themeName];
    try { localStorage.setItem(THEME_KEY, themeName); } catch {}

}

function loadData(){
  try{
    // Check URL hash for migrated data (when switching from file:// to localhost)
    if(window.location.hash && window.location.hash.startsWith("#BAJMIGRATE:")){
      try{
        const encoded=window.location.hash.slice(12);
        const decoded=JSON.parse(decodeURIComponent(atob(encoded)));
        if(decoded.data){localStorage.setItem(STORAGE_KEY,JSON.stringify(decoded.data));}
        if(decoded.auth){localStorage.setItem(AUTH_KEY,JSON.stringify(decoded.auth));}
        // Clean up URL
        history.replaceState(null,"",window.location.pathname);
      }catch(e){console.log("Migration parse error:",e);}
    }
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){const p=JSON.parse(r);if(p&&typeof p==="object")return p;}
    return null;
  }catch{return null;}
}
function saveData(d){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
    // Keep sessionStorage in sync for URL switches
    sessionStorage.setItem("ba_data_transfer",JSON.stringify(d));
  }catch{}
}
function loadAuth(){
  try{
    // Check current key first
    const r=localStorage.getItem(AUTH_KEY);
    if(r){const p=JSON.parse(r);if(p&&p.name&&p.pinHash)return p;}
    // Check legacy key names from older versions
    const legacyKeys=["ba_auth_v8","ba_auth_v7","ba_journal_auth_v8","ba_auth"];
    for(const k of legacyKeys){
      const old=localStorage.getItem(k);
      if(old){const p=JSON.parse(old);if(p&&p.name&&p.pinHash){localStorage.setItem(AUTH_KEY,old);return p;}}
    }
    // Check sessionStorage (used for cross-origin transfer between file:// and localhost)
    const sess=sessionStorage.getItem("ba_auth_transfer");
    if(sess){const p=JSON.parse(sess);if(p&&p.name&&p.pinHash){localStorage.setItem(AUTH_KEY,sess);return p;}}
    return null;
  }catch{return null;}
}
function saveAuth(a){
  if(!a){return;}
  try{
    localStorage.setItem(AUTH_KEY,JSON.stringify(a));
    // Also save to sessionStorage as backup for URL switches
    sessionStorage.setItem("ba_auth_transfer",JSON.stringify(a));
  }catch{}
}

async function callClaude(messages,system,maxTokens=1000){
  const key=localStorage.getItem("ba_api_key")||"";
  if(!key) throw new Error("No API key — go to Settings to add your Anthropic API key");
  const headers={
    "Content-Type":"application/json",
    "x-api-key": key,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true"
  };
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers,
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:maxTokens,system,messages}),
  });
  if(!res.ok)throw new Error(`API error ${res.status}`);
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data.content?.[0]?.text||"";
}

function hashPin(pin){let h=0;for(let i=0;i<pin.length;i++){h=((h<<5)-h)+pin.charCodeAt(i);h|=0;}return h.toString(36);}

// ─── SIGN IN PAGE ─────────────────────────────────────────────────────────────
function SignInPage({onSignIn}){
  // Re-check localStorage every render so sign-out -> sign-in works correctly
  const existingAuth = loadAuth();
  const [tab, setTab] = useState(() => loadAuth() ? "signin" : "signup");
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [pin, setPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [error, setError] = useState("");
  const [restoreStr, setRestoreStr] = useState("");
  const [restoreResult, setRestoreResult] = useState(null);
  const [restoreData, setRestoreData] = useState(null);
  const [restoreName, setRestoreName] = useState("");
  const [restorePin, setRestorePin] = useState("");
  const [restoreConfirm, setRestoreConfirm] = useState("");
  const [restoreStep, setRestoreStep] = useState(1);
  const [chunks, setChunks] = useState({});
  const [chunkInfo, setChunkInfo] = useState(null); // {total, received}

  const handleCreate = () => {
    if (!name.trim()) { setError("Please enter your name"); return; }
    if (!ACCESS_CODES.includes(code.trim().toUpperCase())) { setError("Invalid access code — contact your administrator"); return; }
    if (pin.length < 4) { setError("PIN must be at least 4 digits"); return; }
    if (pin !== confirmPin) { setError("PINs do not match"); return; }
    const auth = { name: name.trim(), codeLast4: code.slice(-4), pinHash: hashPin(pin), createdAt: new Date().toISOString() };
    saveAuth(auth);
    onSignIn(auth);
  };

  const handleRestore = () => {
    const str = restoreStr.trim();
    if (!str) { setRestoreResult({ ok: false, error: "Please paste your backup string" }); return; }

    // Handle chunked backup: BAJCHUNK:N:TOTAL:...data...
    if (str.startsWith("BAJCHUNK:")) {
      const colonIdx1 = str.indexOf(":", 9);       // after BAJCHUNK:
      const colonIdx2 = str.indexOf(":", colonIdx1 + 1);
      const chunkNum = parseInt(str.slice(9, colonIdx1));
      const totalChunks = parseInt(str.slice(colonIdx1 + 1, colonIdx2));
      const chunkData = str.slice(colonIdx2 + 1);

      if (isNaN(chunkNum) || isNaN(totalChunks)) {
        setRestoreResult({ ok: false, error: "Malformed chunk — please copy the backup string again" });
        return;
      }

      const newChunks = { ...chunks, [chunkNum]: chunkData };
      setChunks(newChunks);
      setRestoreStr(""); // clear for next paste

      const received = Object.keys(newChunks).length;
      setChunkInfo({ total: totalChunks, received, nums: Object.keys(newChunks).map(Number).sort() });

      if (received < totalChunks) {
        // Still need more chunks
        const missing = [];
        for (let i = 1; i <= totalChunks; i++) { if (!newChunks[i]) missing.push(i); }
        setRestoreResult({ ok: false, error: null, info: `Chunk ${chunkNum} of ${totalChunks} received ✓ — paste chunk ${missing[0]} next` });
        return;
      }

      // All chunks received — reassemble
      let fullStr = "";
      for (let i = 1; i <= totalChunks; i++) fullStr += newChunks[i];
      const result = decodeBackup(fullStr);
      if (result.ok) {
        setRestoreData(result.data);
        setRestoreResult({ ok: true });
        setRestoreStep(2);
      } else {
        setRestoreResult({ ok: false, error: result.error });
      }
      return;
    }

    // Single backup string
    const result = decodeBackup(str);
    if (result.ok) {
      setRestoreData(result.data);
      setRestoreResult({ ok: true });
      setRestoreStep(2);
    } else {
      setRestoreResult({ ok: false, error: result.error });
    }
  };

  const handleRestoreJSON = (parsed) => {
    setRestoreData(parsed);
    setRestoreResult({ ok: true, msg: "✅ File loaded! Now set your name and PIN to sign in." });
    setRestoreStep(2);
  };

  const handleRestoreFinish = () => {
    if (!restoreName.trim()) { setRestoreResult({ ok: false, error: "Please enter your name" }); return; }
    if (restorePin.length < 4) { setRestoreResult({ ok: false, error: "PIN must be at least 4 digits" }); return; }
    if (restorePin !== restoreConfirm) { setRestoreResult({ ok: false, error: "PINs do not match" }); return; }
    try {
      // Save all app data to localStorage
      const dataToSave = { ...restoreData };
      delete dataToSave._auth; // remove any old auth blob
      localStorage.setItem("ba_journal_v9", JSON.stringify(dataToSave));
    } catch(e) { console.error("Data save error:", e); }
    // Create fresh auth profile and sign in immediately
    const auth = {
      name: restoreName.trim(),
      pinHash: hashPin(restorePin),
      createdAt: new Date().toISOString(),
      restoredAt: new Date().toISOString()
    };
    saveAuth(auth);
    // Sign in - this triggers the main app to load with the restored data
    onSignIn(auth);
  };

  const BG = (
    <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(circle at 20% 50%,#c4962a08 0%,transparent 50%),radial-gradient(circle at 80% 20%,#4a9fd408 0%,transparent 50%)"}}/>
      <div style={{position:"absolute",inset:0,backgroundImage:"linear-gradient(#25222015 1px,transparent 1px),linear-gradient(90deg,#25222015 1px,transparent 1px)",backgroundSize:"50px 50px"}}/>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#0a0908",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      {BG}
      <div style={{position:"relative",zIndex:1,width:"100%",maxWidth:480}}>

        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:30}}>
          <div style={{width:72,height:72,background:"linear-gradient(135deg,#c4962a,#8b6914)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 14px",boxShadow:"0 0 40px #c4962a25"}}>📋</div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:30,fontWeight:900,color:"#e8c97a",letterSpacing:"-0.5px"}}>BA Journal Pro</div>
          <div style={{fontSize:10,color:"#3a3028",fontFamily:"'Source Code Pro',monospace",letterSpacing:"0.2em",marginTop:5}}>YOUR PERSONAL BA GROWTH JOURNAL · 2026</div>
        </div>

        {/* 3-way tab switcher */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:3,marginBottom:24,background:"#0d0c0a",borderRadius:12,padding:4,border:"1px solid #1e1c18"}}>
          {[
            {id:"signin", label:"Sign In", sub:"have account", icon:"🔐"},
            {id:"signup", label:"Sign Up", sub:"needs access code", icon:"✨"},
            {id:"restore", label:"Restore", sub:"moving devices", icon:"📲"},
          ].map(t => (
            <button key={t.id} onClick={() => { setTab(t.id); setError(""); setRestoreResult(null); }}
              style={{
                padding:"11px 6px 9px",
                borderRadius:9,
                border:"none",
                background: tab===t.id ? "linear-gradient(135deg,#c4962a,#8b6914)" : "transparent",
                color: tab===t.id ? "#0a0908" : "#605040",
                fontFamily:"'Source Code Pro',monospace",
                cursor:"pointer",
                transition:"all 0.2s",
                display:"flex",flexDirection:"column",alignItems:"center",gap:3
              }}>
              <span style={{fontSize:16}}>{t.icon}</span>
              <span style={{fontSize:12,fontWeight:700}}>{t.label}</span>
              <span style={{fontSize:9,opacity:0.7,letterSpacing:"0.03em"}}>{t.sub}</span>
            </button>
          ))}
        </div>

        <div style={{background:"#13110f",border:"1px solid #2a2520",borderRadius:16,padding:28,boxShadow:"0 24px 80px rgba(0,0,0,0.5)"}}>

          {/* ── SIGN IN ── */}
          {tab === "signin" && (
            existingAuth ? (
              <PinLoginPage auth={existingAuth} onSignIn={onSignIn} onNewProfile={() => setTab("signup")} compact={true} />
            ) : (
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{fontSize:44,marginBottom:14}}>👤</div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"#a09070",marginBottom:8}}>No account found on this device</div>
                {window.location.hostname==="localhost" || window.location.hostname==="127.0.0.1" ? (
                  <div style={{background:"#1a2a0d",border:"1px solid #3a5a1a",borderRadius:8,padding:"12px 16px",marginBottom:16,textAlign:"left"}}>
                    <div style={{fontSize:12,color:"#8ad448",fontFamily:"'Source Code Pro',monospace",fontWeight:700,marginBottom:6}}>
                      💡 Switching from the file:// version?
                    </div>
                    <div style={{fontSize:11,color:"#6a9438",fontFamily:"'Source Code Pro',monospace",lineHeight:1.8}}>
                      Your previous data is stored under the old URL.<br/>
                      Click <strong style={{color:"#b7e4c7"}}>"Restore"</strong> tab above → import your JSON backup file.<br/>
                      Or click <strong style={{color:"#b7e4c7"}}>"Sign Up"</strong> and use any access code to create a fresh profile here.
                    </div>

                ) : (

                {(() => {

                  const found = allKeys.map(k => { try { const v = JSON.parse(localStorage.getItem(k)); return v && v.name ? {key:k,name:v.name} : null; } catch { return null; } }).filter(Boolean);
                  if (found.length > 0) return (
                    <div style={{background:"#0d2a1a",border:"1px solid #1a5a2a",borderRadius:8,padding:"12px 16px",marginBottom:16,textAlign:"left"}}>
                      <div style={{fontSize:11,color:"#4ad48a",fontFamily:"'Source Code Pro',monospace",marginBottom:8,fontWeight:700}}>🔍 Found existing profile(s):</div>

                <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>

function PinLoginPage({auth,onSignIn,onNewProfile,compact}){
  const [pin,setPin]=useState("");
  const [error,setError]=useState("");
  const [dots,setDots]=useState([false,false,false,false]);

  const addDigit=(d)=>{
    if(pin.length>=6)return;
    const newPin=pin+d;
    setPin(newPin);
    setDots(prev=>{const n=[...prev];n[newPin.length-1]=true;return n;});
    if(newPin.length>=4){
      setTimeout(()=>{
        if(hashPin(newPin)===auth.pinHash){onSignIn(auth);}
        else{setError("Wrong PIN. Try again.");setPin("");setDots([false,false,false,false]);}
      },200);
    }
  };

  const delDigit=()=>{
    if(!pin.length)return;
    const newPin=pin.slice(0,-1);
    setPin(newPin);
    setDots(prev=>{const n=[...prev];n[newPin.length]=false;return n;});
    setError("");
  };

  const KEYS=["1","2","3","4","5","6","7","8","9","","0","⌫"];

  if(compact){
    return(
      <div style={{textAlign:"center"}}>
        <div style={{width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,#c4962a,#8b6914)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,color:"#0a0908",margin:"0 auto 10px"}}>
          {auth.name?auth.name[0].toUpperCase():"A"}

        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"#e8c97a",marginBottom:2}}>Welcome back,</div>

          {[0,1,2,3].map(i=><div key={i} style={{width:13,height:13,borderRadius:"50%",background:pin.length>i?"#c4962a":"transparent",border:`2px solid ${pin.length>i?"#c4962a":"#3a3028"}`,transition:"all 0.15s"}}/>)}
        </div>
        {error&&<div style={{fontSize:11,color:"#d44a4a",fontFamily:"'Source Code Pro',monospace",marginBottom:10,minHeight:18}}>{error}</div>}
        {!error&&<div style={{minHeight:18,marginBottom:10}}/>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,maxWidth:240,margin:"0 auto 20px"}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((k,i)=>(
            <button key={i} onClick={()=>k==="⌫"?delDigit():k?addDigit(k):null}
              style={{height:54,borderRadius:12,border:"1px solid #252220",background:k?"#161412":"transparent",color:k==="⌫"?"#d44a4a":k?"#e8e0d0":"transparent",fontSize:k==="⌫"?16:18,fontFamily:"'Source Code Pro',monospace",cursor:k?"pointer":"default",transition:"all 0.1s"}}
              onMouseDown={e=>{if(k)e.currentTarget.style.transform="scale(0.94)";}}
              onMouseUp={e=>{e.currentTarget.style.transform="scale(1)";}}>
              {k}
            </button>
          ))}
        </div>
        <button onClick={()=>{ onNewProfile&&onNewProfile(); }}

          Create new profile or restore

  return(
    <div style={{minHeight:"100vh",background:"#0a0908",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(circle at 50% 30%,#c4962a08 0%,transparent 60%)",pointerEvents:"none"}}/>

          {auth.name?auth.name[0].toUpperCase():"A"}

  );
}

function PinManager({auth,onClose,onUpdate,notify}){
  const [cur,setCur]=useState("");
  const [newPin,setNewPin]=useState("");
  const [conf,setConf]=useState("");
  const [err,setErr]=useState("");

  const save=()=>{
    if(hashPin(cur)!==auth.pinHash){setErr("Current PIN is incorrect");return;}
    if(newPin.length<4){setErr("New PIN must be 4+ digits");return;}
    if(newPin!==conf){setErr("New PINs do not match");return;}
    const updated={...auth,pinHash:hashPin(newPin)};
    saveAuth(updated);
    onUpdate(updated);
    notify("PIN updated successfully ✓");
    onClose();
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#13110f",border:"1px solid #3a3520",borderRadius:14,padding:28,maxWidth:380,width:"100%"}}>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"#e8c97a",marginBottom:18}}>🔐 Change PIN</div>
        {[{label:"CURRENT PIN",v:cur,set:setCur},{label:"NEW PIN",v:newPin,set:setNewPin},{label:"CONFIRM NEW PIN",v:conf,set:setConf}].map(f=>(
          <div key={f.label} style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#a09070",fontFamily:"'Source Code Pro',monospace",marginBottom:5}}>{f.label}</div>
            <input value={f.v} onChange={e=>f.set(e.target.value)} type="password" placeholder="••••"
              style={{background:"#1a1612",border:"1px solid #252220",color:"#e8e0d0",padding:"10px 13px",borderRadius:7,fontFamily:"'Source Code Pro',monospace",fontSize:13,outline:"none",width:"100%",boxSizing:"border-box"}}/>
          </div>
        ))}
        {err&&<div style={{fontSize:11,color:"#d44a4a",fontFamily:"'Source Code Pro',monospace",marginBottom:12}}>⚠ {err}</div>}
        <div style={{display:"flex",gap:10,marginTop:6}}>

          <button onClick={onClose} style={{...S.btnOutline}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

              onChange={e => setForm(f => ({ ...f, content: e.target.value }))}

                        {entry.tags?.length > 0 && (
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 10 }}>

                    <span style={{ color: C.textFaint, fontSize: 11 }}>{isOpen ? "▲" : "▼"}</span>

      )}
    </div>
  );
}

// ─── ROADMAP VIEW ─────────────────────────────────────────────────────────────
function RoadmapView({ data, update, slotToCalMonth }) {
  const [selected, setSelected] = useState(null);

  const toggleTopic = (slot, topic) => {
    const k = `ba_${slot}_${topic}`;
    update("roadmapProgress", { ...data.roadmapProgress, [k]: !data.roadmapProgress[k] });
  };

  const mp = (slot) => {
    const topics = BA_ROADMAP.find(r => r.slot === slot)?.topics || [];
    const done = topics.filter(t => data.roadmapProgress[`ba_${slot}_${t}`]).length;
    return { done, total: topics.length, pct: topics.length ? Math.round((done / topics.length) * 100) : 0 };
  };

  return (
    <div className="fade-in">
      <div style={{ marginBottom: 24 }}>
        <div style={S.sectionTitle}>BA Roadmap — 12 Months</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={S.sectionSub}>Curated courses from LinkedIn Learning, Udemy & Pluralsight · Click a month to explore & track topics</div><ExportBar pageId="roadmap" data={data}/></div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
        {BA_ROADMAP.map(r => {
          const p = mp(r.slot);
          const cm = slotToCalMonth(r.slot);
          const isOpen = selected === r.slot;
          const isDone = p.pct === 100;
          return (
            <div
              key={r.slot}
              onClick={() => setSelected(isOpen ? null : r.slot)}
              style={{ ...S.card, cursor: "pointer", borderColor: isDone ? "#1a3a1a" : isOpen ? C.borderHov : C.border, borderLeft: `3px solid ${r.color}40`, transition: "border-color 0.2s" }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                <div>
                  <div style={{ display: "flex", gap: 7, marginBottom: 4 }}>
                    <span style={{ fontSize: 10, fontFamily: "'Source Code Pro', monospace", color: C.textDim }}>MONTH {r.slot}</span>
                    <span style={{ fontSize: 10, fontFamily: "'Source Code Pro', monospace", color: C.gold }}>{cm.month} {cm.year}</span>
                  </div>
                  <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 14.5, color: C.text }}>{r.title}</div>
                </div>
                <span style={{ fontSize: 11, color: isDone ? C.green : C.gold, fontFamily: "'Source Code Pro', monospace", marginLeft: 8, flexShrink: 0 }}>{p.pct}%</span>
              </div>
              <CourseBadge course={r.course} style={{ marginBottom: 10 }} />
              <ProgressBar pct={p.pct} color={isDone ? "linear-gradient(90deg,#1a8b44,#4ad48a)" : `linear-gradient(90deg,${r.color}80,${r.color})`} />
              <div style={{ fontSize: 10.5, color: C.textFaint, fontFamily: "'Source Code Pro', monospace", marginTop: 5 }}>{p.done}/{p.total} topics</div>
              {isOpen && (
                <div className="fade-in" style={{ marginTop: 12, borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
                  {r.topics.map(t => {
                    const done = data.roadmapProgress[`ba_${r.slot}_${t}`];
                    return (
                      <div key={t} style={{ display: "flex", alignItems: "center", gap: 9, padding: "5px 0" }}
                        onClick={e => { e.stopPropagation(); toggleTopic(r.slot, t); }}>
                        <Checkbox checked={!!done} onClick={() => toggleTopic(r.slot, t)} />
                        <span style={{ fontSize: 12, color: done ? C.green : C.textMid, textDecoration: done ? "line-through" : "none", fontFamily: "'Source Code Pro', monospace" }}>{t}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── TECHNICAL BA VIEW ────────────────────────────────────────────────────────
function TechnicalBAView({ data, update, slotToCalMonth }) {
  const [selected, setSelected] = useState(null);
  const [track, setTrack] = useState("both");

  const toggleTopic = (slot, tr, topic) => {
    const k = `tech_${slot}_${tr}_${topic}`;
    update("techProgress", { ...data.techProgress, [k]: !data.techProgress[k] });
  };

  const sp = (slot) => {
    const r = TECH_ROADMAP.find(m => m.slot === slot);
    if (!r) return { td: 0, tt: 0, bd: 0, bt: 0 };
    const td = r.tech.topics.filter(t => data.techProgress[`tech_${slot}_tech_${t}`]).length;
    const bd = r.tools.topics.filter(t => data.techProgress[`tech_${slot}_tools_${t}`]).length;
    return { td, tt: r.tech.topics.length, bd, bt: r.tools.topics.length };
  };

  const totals = TECH_ROADMAP.reduce((s, r) => { const p = sp(r.slot); return { d: s.d + p.td + p.bd, t: s.t + p.tt + p.bt }; }, { d: 0, t: 0 });
  const totalPct = totals.t ? Math.round((totals.d / totals.t) * 100) : 0;

  const badgeOf = (badge) => BADGE[badge] || BADGE.LinkedIn;

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
        <div>
          <div style={S.sectionTitle}>Technical BA Roadmap</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={S.sectionSub}>Expert BA v3 · Two parallel tracks · 🔵 Technical Skills + 🟣 BA Tools</div><ExportBar pageId="technical" data={data}/></div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 20, fontFamily: "'Playfair Display', serif", color: C.goldLight }}>{totalPct}%</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        {["both", "tech", "tools"].map(t => (
          <Btn key={t} variant="outline" sm onClick={() => setTrack(t)}
            style={{ borderColor: track === t ? C.gold : C.border, color: track === t ? C.goldLight : C.textDim, background: track === t ? "#1e1a08" : "transparent" }}>
            {t === "both" ? "Both Tracks" : t === "tech" ? "🔵 Technical" : "🟣 BA Tools"}
          </Btn>
        ))}
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 12, fontSize: 10, fontFamily: "'Source Code Pro', monospace", background: "#0d1e2e", color: C.blue, border: `1px solid #1a3a5a` }}>🔵 Primary Track</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 12, fontSize: 10, fontFamily: "'Source Code Pro', monospace", background: "#1e0d2e", color: C.purple, border: `1px solid #3a1a5a` }}>🟣 Secondary Track</span>
        </div>
      </div>

      <div style={{ display: "grid", gap: 12 }}>
        {TECH_ROADMAP.map(r => {
          const p = sp(r.slot);
          const cm = slotToCalMonth(r.slot);
          const isOpen = selected === r.slot;

// ─── AUTOMATION VIEW ──────────────────────────────────────────────────────────
function AutomationView({ data, update }) {
  const [expandedPhase, setExpandedPhase] = useState(null);
  const [expandedSlot, setExpandedSlot] = useState(null);
  const prog = data.automationProgress || {};

  function toggleDone(key) {
    const cur = prog[key] || {};
    const next = { ...cur, done: !cur.done };
    update("automationProgress", { ...prog, [key]: next });
  }

  function totalDone() {
    let d = 0, t = 0;
    AUTO_PHASES.forEach(ph => ph.months.forEach(m => { t += 2; if ((prog[`${m.slot}_course`] || {}).done) d++; if ((prog[`${m.slot}_tools`] || {}).done) d++; }));
    return { d, t };
  }

  const { d, t } = totalDone();
  const pct = Math.round((d / t) * 100);

  const BadgePill = ({ badge }) => {
    const bColors = { Udemy:"#a435f0", LinkedIn:"#0077b5", Free:"#22863a", Pluralsight:"#f15b2a", YouTube:"#ff0000" };
    return (
      <span style={{ background: bColors[badge] || C.gold, color:"#fff", fontSize:10, fontWeight:700, padding:"2px 7px", borderRadius:10, marginLeft:6, letterSpacing:"0.5px", textTransform:"uppercase" }}>
        {badge}
      </span>
    );
  };

  const CourseCard = ({ item, type, slot }) => {
    const key = `${slot}_${type}`;
    const done = (prog[key] || {}).done;
    return (
      <div style={{ background: done ? "#0e1a0e" : "#1a1810", border:`1px solid ${done ? "#2a5c2a" : C.border}`, borderRadius:8, padding:"12px 14px", marginTop:8, transition:"all 0.2s" }}>
        <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8 }}>
          <div style={{ flex:1 }}>
            <div style={{ display:"flex", alignItems:"center", flexWrap:"wrap", gap:4, marginBottom:4 }}>
              <span style={{ color: done ? "#4caf50" : C.goldLight, fontWeight:700, fontSize:13 }}>{item.name}</span>
              <BadgePill badge={item.badge} />
            </div>
            {item.instructor && <div style={{ color:C.textMid, fontSize:11, marginBottom:3 }}>👤 {item.instructor}</div>}
            <div style={{ display:"flex", gap:12, marginBottom:6 }}>
              {item.rating && <span style={{ color:C.gold, fontSize:11 }}>⭐ {item.rating}</span>}
              {item.students && <span style={{ color:C.textMid, fontSize:11 }}>👥 {item.students}</span>}
            </div>
            <div style={{ color:C.textMid, fontSize:11, lineHeight:"1.5", marginBottom:8 }}>{item.note}</div>
          </div>
          <button
            onClick={() => toggleDone(key)}
            style={{ background: done ? "#2a5c2a" : "transparent", border:`1px solid ${done ? "#4caf50" : C.border}`, borderRadius:6, color: done ? "#4caf50" : C.textMid, padding:"4px 10px", cursor:"pointer", fontSize:11, whiteSpace:"nowrap", flexShrink:0, transition:"all 0.2s" }}
          >
            {done ? "✓ Done" : "Mark Done"}
          </button>
        </div>
        <a href={item.url} target="_blank" rel="noopener noreferrer"
          style={{ color:C.gold, fontSize:11, textDecoration:"none", display:"inline-flex", alignItems:"center", gap:4, border:`1px solid ${C.border}`, borderRadius:5, padding:"4px 10px" }}
        >
          🔗 Open Course ›
        </a>
      </div>
    );
  };

  return (
    <div style={{ padding:"0 0 60px" }}>
      {/* ── HEADER ── */}
      <div style={{ ...S.card, marginBottom:20, background:"linear-gradient(135deg,#1a1400 0%,#0d1117 100%)", border:`1px solid ${C.border}`, position:"relative" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
          <span style={{ fontSize:32 }}>🤖</span>
          <div>
            <h2 style={{ color:C.goldLight, margin:0, fontSize:20, fontWeight:800, letterSpacing:"0.5px" }}>Automation Roadmap</h2><div style={{position:"absolute",top:14,right:14}}><ExportBar pageId="automation" data={data}/></div>
            <div style={{ color:C.textMid, fontSize:12, marginTop:2 }}>No-code · AI Agents · Freelance Side Hustle · Fiverr Income</div>
          </div>
        </div>
        <p style={{ color:C.textMid, fontSize:13, lineHeight:"1.7", margin:"0 0 16px" }}>
          A complete 12-month beginner-to-advanced roadmap covering Monday.com, Zapier, Make, Notion, Airtable, n8n, GoHighLevel — and how to turn these skills into real freelance income on Fiverr. Each phase builds on the last, and every skill applies directly to your BA role.
        </p>

        {/* Overall Progress */}
        <div style={{ background:"#0d1117", borderRadius:8, padding:"12px 14px", border:`1px solid ${C.border}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
            <span style={{ color:C.textMid, fontSize:12 }}>Overall Progress</span>
            <span style={{ color:C.goldLight, fontSize:12, fontWeight:700 }}>{d}/{t} completed · {pct}%</span>
          </div>
          <div style={{ background:"#1a1810", borderRadius:4, height:8, overflow:"hidden" }}>
            <div style={{ width:`${pct}%`, height:"100%", background:`linear-gradient(90deg,${C.gold},#e0b840)`, borderRadius:4, transition:"width 0.5s" }} />
          </div>
        </div>

        {/* Fiverr Services You Can Offer */}
        <div style={{ marginTop:14, padding:"10px 14px", background:"#0e1a0e", borderRadius:8, border:"1px solid #2a5c2a" }}>
          <div style={{ color:"#4caf50", fontWeight:700, fontSize:12, marginBottom:8 }}>💰 Fiverr Services You Can Offer (Once Skilled Up)</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {["Zapier automation setup","Make.com workflow builds","n8n AI agent builds","Notion workspace setup","Airtable database build","Monday.com CRM setup","GoHighLevel funnels","Process automation consulting","AI agent for client onboarding","Email/SMS sequence automation"].map(s =>
              <span key={s} style={{ background:"#1a2e1a", color:"#81c784", border:"1px solid #2a5c2a", borderRadius:12, padding:"3px 10px", fontSize:11 }}>{s}</span>
            )}
          </div>
        </div>
      </div>

      {/* ── PHASES ── */}
      {AUTO_PHASES.map(ph => {
        const phDone = ph.months.reduce((acc, m) => acc + ((prog[`${m.slot}_course`] || {}).done ? 1 : 0) + ((prog[`${m.slot}_tools`] || {}).done ? 1 : 0), 0);
        const phTotal = ph.months.length * 2;
        const phPct = Math.round((phDone / phTotal) * 100);
        const isPhOpen = expandedPhase === ph.phase;

        return (
          <div key={ph.phase} style={{ ...S.card, marginBottom:14, border:`1px solid ${ph.color}40`, padding:0, overflow:"hidden" }}>
            {/* Phase Header */}
            <button
              onClick={() => setExpandedPhase(isPhOpen ? null : ph.phase)}
              style={{ width:"100%", background:"transparent", border:"none", cursor:"pointer", padding:"14px 18px", textAlign:"left", display:"flex", alignItems:"center", gap:12 }}
            >
              <span style={{ fontSize:24, flexShrink:0 }}>{ph.emoji}</span>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                  <span style={{ color:C.goldLight, fontWeight:800, fontSize:14 }}>Phase {ph.phase}: {ph.title}</span>
                  <span style={{ color:ph.color === "#7c6f3e" ? "#c9b458" : ph.color === "#3e6b7c" ? "#4ab3d4" : ph.color === "#5c3e7c" ? "#a78bfa" : "#4caf50", fontSize:11, background: `${ph.color}20`, border:`1px solid ${ph.color}50`, borderRadius:10, padding:"2px 8px" }}>{ph.subtitle}</span>
                </div>
                <div style={{ color:C.textMid, fontSize:12, marginTop:3 }}>{ph.description}</div>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
                  <div style={{ flex:1, background:"#0d1117", borderRadius:3, height:5, overflow:"hidden" }}>
                    <div style={{ width:`${phPct}%`, height:"100%", background:ph.color, borderRadius:3, transition:"width 0.4s" }} />
                  </div>
                  <span style={{ color:C.textMid, fontSize:11, flexShrink:0 }}>{phDone}/{phTotal}</span>
                </div>
              </div>
              <span style={{ color:C.textMid, fontSize:16, flexShrink:0, transform: isPhOpen ? "rotate(90deg)" : "none", transition:"transform 0.2s" }}>›</span>
            </button>

            {/* Phase Months */}
            {isPhOpen && (
              <div style={{ borderTop:`1px solid ${C.border}`, padding:"0 18px 18px" }}>
                {ph.months.map(m => {
                  const isOpen = expandedSlot === `${ph.phase}_${m.slot}`;
                  const cDone = (prog[`${m.slot}_course`] || {}).done;
                  const tDone = (prog[`${m.slot}_tools`] || {}).done;
                  const slotDone = cDone && tDone;

                  return (
                    <div key={m.slot} style={{ marginTop:14, background: slotDone ? "#0a160a" : "#14120a", border:`1px solid ${slotDone ? "#2a5c2a" : C.border}`, borderRadius:8, overflow:"hidden" }}>
                      {/* Month Header */}
                      <button
                        onClick={() => setExpandedSlot(isOpen ? null : `${ph.phase}_${m.slot}`)}
                        style={{ width:"100%", background:"transparent", border:"none", cursor:"pointer", padding:"12px 14px", textAlign:"left", display:"flex", alignItems:"center", gap:10 }}
                      >
                        <div style={{ width:28, height:28, borderRadius:"50%", background: slotDone ? "#2a5c2a" : "#1c1a16", border:`2px solid ${slotDone ? "#4caf50" : ph.color}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                          <span style={{ color: slotDone ? "#4caf50" : C.gold, fontSize:11, fontWeight:700 }}>{slotDone ? "✓" : m.slot}</span>
                        </div>
                        <div style={{ flex:1 }}>
                          <div style={{ color: slotDone ? "#4caf50" : C.goldLight, fontWeight:700, fontSize:13 }}>Month {m.slot}: {m.focus}</div>
                          <div style={{ color:C.textMid, fontSize:11, marginTop:2 }}>🎯 {m.milestone}</div>
                        </div>
                        <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                          {cDone && <span style={{ color:"#4caf50", fontSize:11 }}>📚✓</span>}

function TasksView({ data, update, notify, slotToCalMonth }) {
  const [showForm, setShowForm] = useState(false);
  const [filter, setFilter] = useState("all");
  const [form, setForm] = useState({ title: "", description: "", priority: "medium", category: "learning", dueDate: "", slot: 1 });

  const PRIORITY_COLORS = { high: C.red, medium: C.gold, low: C.green };
  const CATS = ["learning", "practice", "networking", "certification", "technical", "batools"];

  const addTask = () => {
    if (!form.title.trim()) { notify("Please add a task title", "error"); return; }
    update("tasks", [...data.tasks, { ...form, id: Date.now(), completed: false, createdAt: new Date().toISOString() }]);
    setForm({ title: "", description: "", priority: "medium", category: "learning", dueDate: "", slot: 1 });
    setShowForm(false);
    notify("Task added ✓");
  };

  const toggle = id => update("tasks", data.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
  const del = id => { update("tasks", data.tasks.filter(t => t.id !== id)); notify("Task removed"); };

  const filtered = (() => {
    if (filter === "all") return data.tasks;
    if (filter === "open") return data.tasks.filter(t => !t.completed);
    if (filter === "done") return data.tasks.filter(t => t.completed);
    return data.tasks.filter(t => !t.completed && t.priority === filter);
  })();

  const stats = {
    total: data.tasks.length,
    done: data.tasks.filter(t => t.completed).length,
    high: data.tasks.filter(t => !t.completed && t.priority === "high").length,
  };

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22 }}>
        <div>
          <div style={S.sectionTitle}>BA Journey Tasks</div>
          <div style={S.sectionSub}>Track all activities across your 12-month plan</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}><ExportBar pageId="tasks" data={data}/><Btn onClick={() => setShowForm(v => !v)}>{showForm ? "✕ Cancel" : "+ Add Task"}</Btn></div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 22 }}>
        {[{ l: "Total Tasks", v: stats.total, c: C.gold }, { l: "Completed", v: stats.done, c: C.green }, { l: "High Priority", v: stats.high, c: C.red }].map(s => (
          <div key={s.l} style={{ ...S.card, textAlign: "center", padding: 16 }}>
            <div style={{ fontSize: 26, fontFamily: "'Playfair Display', serif", color: s.c }}>{s.v}</div>
            <div style={{ fontSize: 10.5, color: C.textDim, fontFamily: "'Source Code Pro', monospace", marginTop: 3 }}>{s.l}</div>
          </div>
        ))}
      </div>

      {showForm && (
        <div className="fade-in" style={{ ...S.card, marginBottom: 18, borderColor: C.borderHov }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.goldLight, marginBottom: 12 }}>New Task</div>
          <div style={{ display: "grid", gap: 10 }}>
            <Input value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="Task title" />
            <Textarea value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} rows={2} placeholder="Description (optional)" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
              <Select value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))}>
                <option value="high">🔴 High</option>
                <option value="medium">🟡 Medium</option>
                <option value="low">🟢 Low</option>
              </Select>
              <Select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                {CATS.map(c => <option key={c} value={c}>{c.charAt(0).toUpperCase() + c.slice(1)}</option>)}
              </Select>
              <Select value={form.slot} onChange={e => setForm(f => ({ ...f, slot: Number(e.target.value) }))}>
                {BA_ROADMAP.map(r => { const cm = slotToCalMonth(r.slot); return <option key={r.slot} value={r.slot}>M{r.slot} · {cm.month}</option>; })}
              </Select>
              <Input type="date" value={form.dueDate} onChange={e => setForm(f => ({ ...f, dueDate: e.target.value }))} style={{ ...S.input }} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn onClick={addTask}>Add Task</Btn>
              <Btn variant="outline" onClick={() => setShowForm(false)}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {["all", "open", "done", "high", "medium", "low"].map(f => (
          <Btn key={f} variant="outline" sm onClick={() => setFilter(f)}
            style={{ borderColor: filter === f ? C.gold : C.border, color: filter === f ? C.goldLight : C.textDim, background: filter === f ? "#1e1a08" : "transparent" }}>
            {f}
          </Btn>
        ))}
      </div>

      <div style={{ display: "grid", gap: 8 }}>
        {filtered.map(task => {
          const cm = slotToCalMonth(task.slot || 1);
          return (
            <div key={task.id} style={{ display: "flex", alignItems: "flex-start", gap: 11, padding: 13, background: C.bgCard, border: `1px solid ${C.border}`, borderRadius: 8, opacity: task.completed ? 0.55 : 1 }}>
              <Checkbox checked={task.completed} onClick={() => toggle(task.id)} />
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", gap: 7, alignItems: "center", marginBottom: 4, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: "'Playfair Display', serif", color: C.text, fontSize: 14.5, textDecoration: task.completed ? "line-through" : "none" }}>{task.title}</span>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: PRIORITY_COLORS[task.priority] || C.gold, flexShrink: 0 }} />
                  <Tag bg="#0d1e2e" color={C.blue} border="#1a3a5a">{task.category}</Tag>
                  <Tag bg="#1a1408" color={C.gold} border="#2a2010">M{task.slot || 1} · {cm.month}</Tag>
                </div>
                {task.description && <div style={{ fontSize: 12, color: C.textDim, fontFamily: "'Source Code Pro', monospace", marginBottom: 3 }}>{task.description}</div>}
                {task.dueDate && <div style={{ fontSize: 10.5, color: C.textFaint, fontFamily: "'Source Code Pro', monospace" }}>Due: {new Date(task.dueDate).toLocaleDateString("en-GB")}</div>}
              </div>
              <Btn variant="outline" sm onClick={() => del(task.id)} style={{ color: C.red, borderColor: C.red + "40", flexShrink: 0 }}>✕</Btn>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div style={{ ...S.card, textAlign: "center", padding: 40 }}>
            <div style={{ fontSize: 30, marginBottom: 10 }}>✅</div>
            <div style={{ color: C.textDim, fontFamily: "'Source Code Pro', monospace", fontSize: 12.5 }}>No tasks here. Add some to get started!</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CALENDAR VIEW ────────────────────────────────────────────────────────────
function CalendarView({ data, update, notify }) {
  const [date, setDate] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(null);
  const [form, setForm] = useState({ title: "", type: "study", notes: "" });

  const yr = date.getFullYear(), mo = date.getMonth();
  const firstDow = new Date(yr, mo, 1).getDay() || 7; // Mon=1..Sun=7
  const daysInMonth = new Date(yr, mo + 1, 0).getDate();
  const today = new Date();
  const TYPE_COLORS = { study: C.blue, practice: C.gold, networking: C.green, exam: C.red, milestone: C.purple, review: C.orange };

  const dayEvents = d => data.calendarEvents.filter(e => {
    const ed = new Date(e.date);
    return ed.getFullYear() === yr && ed.getMonth() === mo && ed.getDate() === d;
  });

  const addEvent = () => {
    if (!form.title.trim() || !selectedDay) { notify("Please add an event title", "error"); return; }
    update("calendarEvents", [...data.calendarEvents, { ...form, id: Date.now(), date: new Date(yr, mo, selectedDay).toISOString() }]);
    setForm({ title: "", type: "study", notes: "" });
    notify("Event added ✓");
  };

  const delEvent = id => { update("calendarEvents", data.calendarEvents.filter(e => e.id !== id)); notify("Event removed"); };

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22 }}>
        <div>
          <div style={S.sectionTitle}>BA Calendar</div>
          <div style={S.sectionSub}>Plan study sessions, exams & milestones · Click a day to add events</div>
        </div>
        <div style={{display:"flex",gap:8}}><ExportBar pageId="calendar" data={data}/><Btn variant="outline" onClick={() => window.open("https://calendar.google.com", "_blank")}>🔗 Google Calendar ↗</Btn></div>
      </div>

      <div style={{ ...S.card, marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <Btn variant="outline" sm onClick={() => setDate(new Date(yr, mo - 1, 1))}>‹ Prev</Btn>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 17, color: C.goldLight }}>{MONTH_NAMES[mo]} {yr}</div>
          <Btn variant="outline" sm onClick={() => setDate(new Date(yr, mo + 1, 1))}>Next ›</Btn>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 10.5, color: C.textDim, padding: "6px 2px", fontFamily: "'Source Code Pro', monospace" }}>{d}</div>
          ))}
          {Array.from({ length: firstDow - 1 }).map((_, i) => <div key={`e${i}`} />)}
          {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
            const evts = dayEvents(d);
            const isToday = today.getDate() === d && today.getMonth() === mo && today.getFullYear() === yr;
            const isSel = selectedDay === d;
            return (
              <div key={d} onClick={() => setSelectedDay(isSel ? null : d)}
                style={{ padding: "6px 3px", borderRadius: 6, cursor: "pointer", background: isSel ? "#2a1f08" : isToday ? "#1e1a0a" : C.bgCard, border: `1px solid ${isSel ? C.gold : isToday ? "#5a4010" : C.border}`, minHeight: 44, textAlign: "center", transition: "all 0.15s" }}>
                <div style={{ fontSize: 11.5, color: isToday ? C.goldLight : "#908070", fontFamily: "'Source Code Pro', monospace", marginBottom: 3 }}>{d}</div>
                <div style={{ display: "flex", justifyContent: "center", gap: 2, flexWrap: "wrap" }}>
                  {evts.slice(0, 3).map(e => <div key={e.id} style={{ width: 5, height: 5, borderRadius: "50%", background: TYPE_COLORS[e.type] || C.gold }} />)}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 14, marginTop: 14, flexWrap: "wrap" }}>
          {Object.entries(TYPE_COLORS).map(([t, c]) => (
            <div key={t} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <div style={{ width: 7, height: 7, borderRadius: "50%", background: c }} />
              <span style={{ fontSize: 10.5, color: C.textDim, fontFamily: "'Source Code Pro', monospace" }}>{t}</span>
            </div>
          ))}
        </div>
      </div>

      {selectedDay && (
        <div className="fade-in" style={{ ...S.card, marginBottom: 20, borderColor: C.borderHov }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.goldLight, marginBottom: 12 }}>
            {MONTH_NAMES[mo]} {selectedDay}, {yr}
          </div>
          {dayEvents(selectedDay).length > 0 && (
            <div style={{ marginBottom: 14 }}>
              {dayEvents(selectedDay).map(e => (
                <div key={e.id} style={{ display: "flex", gap: 10, alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: TYPE_COLORS[e.type] || C.gold, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, color: "#d0c8b8" }}>{e.title}</span>
                  <Tag bg="#1a1408" color={C.gold} border="#2a2010">{e.type}</Tag>
                  <Btn variant="outline" sm onClick={() => delEvent(e.id)} style={{ color: C.red, borderColor: C.red + "40" }}>✕</Btn>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "grid", gap: 10 }}>
            <Input value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="Event title (e.g. 'Study User Stories', 'Mock interview')" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Select value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
                {Object.keys(TYPE_COLORS).map(t => <option key={t} value={t}>{t.charAt(0).toUpperCase() + t.slice(1)}</option>)}
              </Select>
              <Input value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} placeholder="Notes..." />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn onClick={addEvent}>Add Event</Btn>
              <Btn variant="outline" onClick={() => setSelectedDay(null)}>Close</Btn>
            </div>
          </div>
        </div>
      )}

      {data.calendarEvents.filter(e => new Date(e.date) >= new Date()).length > 0 && (
        <div>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.textMid, marginBottom: 12 }}>Upcoming Events</div>
          <div style={{ display: "grid", gap: 7 }}>
            {[...data.calendarEvents]
              .sort((a, b) => new Date(a.date) - new Date(b.date))
              .filter(e => new Date(e.date) >= new Date())
              .slice(0, 8)
              .map(e => (
                <div key={e.id} style={{ ...S.card, display: "flex", gap: 12, alignItems: "center", padding: 12 }}>
                  <div style={{ width: 9, height: 9, borderRadius: "50%", background: TYPE_COLORS[e.type] || C.gold, flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, color: C.text }}>{e.title}</div>
                    <div style={{ fontSize: 10.5, color: C.textFaint, fontFamily: "'Source Code Pro', monospace" }}>
                      {new Date(e.date).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" })} · {e.type}
                    </div>
                  </div>
                  <Btn variant="outline" sm onClick={() => delEvent(e.id)} style={{ color: C.red, borderColor: C.red + "40" }}>✕</Btn>
                </div>
              ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ASK BA VIEW ──────────────────────────────────────────────────────────────
function AskBAView() {
  const CHAT_KEY = "ba_chat_history_v9";
  const MODE_KEY = "ba_chat_mode_v9";

  const [messages, setMessages] = useState(() => {
    try { const s = localStorage.getItem(CHAT_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
  });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [mode, setMode] = useState(() => localStorage.getItem(MODE_KEY) || "explain");
  const [error, setError] = useState(null);
  const bottomRef = useRef();

  // Persist messages whenever they change
  useEffect(() => {
    try { localStorage.setItem(CHAT_KEY, JSON.stringify(messages.slice(-200))); } catch {}
  }, [messages]);

  // Persist mode
  useEffect(() => {
    try { localStorage.setItem(MODE_KEY, mode); } catch {}
  }, [mode]);

  // Scroll to bottom when messages arrive
  useEffect(() => {
    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: "smooth" }), 80);
  }, [messages, loading]);

  const MODES = [
    { id: "explain", label: "Explain It", icon: "📘" },
    { id: "interview", label: "Interview Prep", icon: "💼" },
    { id: "document", label: "Help Document", icon: "📋" },
    { id: "scenario", label: "Scenario", icon: "🏗️" },
    { id: "technical", label: "Technical BA", icon: "⚙️" },
    { id: "review", label: "Review Work", icon: "🔍" },
  ];

  const SYSTEMS = {
    explain: `You are an expert Technical Business Analyst mentor with 15+ years in financial services and enterprise data platforms. Explain concepts using proper BA terminology: artefacts, epics, acceptance criteria, SDLC phases, sprint ceremonies, BPMN, RTM, RAID, stakeholders, SMEs, etc. Structure every answer: 1) Definition 2) Why it matters in real projects 3) Practical example 4) How to apply it 5) Common mistakes. Be thorough, professional, and encouraging. When referencing external resources, courses or tools, include the full URL in format: [Title](https://url.com)`,
    interview: `You are a senior BA interviewer at a top UK financial services firm. Give realistic interview questions, then provide detailed model answers using professional BA language. Assess: requirements gathering, stakeholder management, analytical skills, communication, Agile knowledge. Provide specific, constructive feedback using real scenarios from enterprise data and portal projects. When referencing resources include full URLs: [Title](https://url.com)`,
    document: `You are a lead BA consultant helping structure professional documentation. For requirements, use Given/When/Then acceptance criteria. For user stories, use the INVEST model. Produce BRD sections, user story cards, use case descriptions, RTM rows, and functional specification sections. Follow BA industry standards (BABOK, BCS). Include relevant reference links with full URLs: [Title](https://url.com)`,
    scenario: `You are a senior Technical BA consultant walking through real-world project scenarios in enterprise data platforms and financial services. Present realistic situations and guide the user through the BA approach. Ask probing questions and teach elicitation, solution design, and stakeholder management through practice. Include relevant reference links: [Title](https://url.com)`,
    technical: `You are a Technical BA who bridges business and technology. Explain technical concepts (APIs, SQL, data models, cloud services, Git, CI/CD, BPMN) in terms a BA needs — not developer depth, but enough to speak confidently with engineers. Use analogies and show how each concept relates to BA work. Include useful reference links: [Title](https://url.com)`,
    review: `You are a senior BA reviewer providing professional feedback. When given BA work, analyse: 1) Strengths 2) Gaps per BABOK/BCS standards 3) Specific improvements with examples 4) Industry best practice comparison. Be direct, detailed, and constructive. Include relevant reference links: [Title](https://url.com)`,
  };

  const QUICK_Q = {
    explain: ["What is a Requirements Traceability Matrix?", "Explain BPMN and when to use it", "Difference between functional and non-functional requirements?", "How do epics, features, and user stories relate?"],
    interview: ["Walk me through gathering requirements for a portal feature", "How would you manage a difficult stakeholder?", "How do you prioritise a product backlog?", "What's your approach to UAT?"],
    document: ["Write a user story for a search feature", "Structure a BRD for a data migration project", "Write acceptance criteria for a login screen", "Create a simple RTM structure"],
    scenario: ["I need to document the current state of our data portal", "A stakeholder keeps changing requirements — what do I do?", "I'm leading a requirements workshop for the first time", "How would I approach a gap analysis?"],
    technical: ["What does an API call look like and why does it matter to a BA?", "How do I read an ER diagram?", "What is CI/CD and what do I need to know?", "Explain AWS in terms a BA would care about"],
    review: ["Review this user story: As a portal admin I want to search metadata so I can find attributes quickly", "I wrote these acceptance criteria — can you review them?", "How should I structure my requirements document?", "Review my stakeholder analysis approach"],
  };

  const send = async () => {
    if (!input.trim() || loading) return;
    setError(null);
    const userMsg = { role: "user", content: input, ts: new Date().toISOString() };
    const newMsgs = [...messages, userMsg];

      setMessages([...newMsgs, { role: "assistant", content: text, ts: new Date().toISOString(), mode }]);
    } catch (err) {
      setError(err.message || "Could not reach the AI. Check your API key in Settings.");
    }
    setLoading(false);
  };

  // Parse text to make URLs clickable inline
  const renderContent = (text) => {
    const parts = [];
    const mdRe = new RegExp("\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\)]+)\\)", "g");
    const bareRe = new RegExp("(https?:\\/\\/[^\\s\\)]+)", "g");
    // Combine both patterns by splitting on URLs
    const segments = [];
    let remaining = text;
    let safetyCount = 0;
    while (remaining.length > 0 && safetyCount++ < 500) {
      const mdMatch = mdRe.exec(remaining);
      const bareMatch = bareRe.exec(remaining);
      mdRe.lastIndex = 0; bareRe.lastIndex = 0;
      // Find earliest match
      const mdIdx = remaining.search(/\[([^\]]+)\]\(https?:\/\//);
      const bareIdx = remaining.search(/https?:\/\//);
      if (mdIdx === -1 && bareIdx === -1) { segments.push({ t: "text", v: remaining }); break; }
      // Check if it's a markdown link first
      const mdFull = /^\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/.exec(remaining.slice(mdIdx === -1 ? Infinity : mdIdx));
      if (mdIdx !== -1 && mdFull && (bareIdx === -1 || mdIdx <= bareIdx)) {
        if (mdIdx > 0) segments.push({ t: "text", v: remaining.slice(0, mdIdx) });
        segments.push({ t: "link", label: mdFull[1], url: mdFull[2] });
        remaining = remaining.slice(mdIdx + mdFull[0].length);
      } else if (bareIdx !== -1) {
        if (bareIdx > 0) segments.push({ t: "text", v: remaining.slice(0, bareIdx) });
        const urlMatch = /^https?:\/\/[^\s\)]+/.exec(remaining.slice(bareIdx));
        if (urlMatch) {
          segments.push({ t: "link", label: urlMatch[0], url: urlMatch[0] });
          remaining = remaining.slice(bareIdx + urlMatch[0].length);
        } else { segments.push({ t: "text", v: remaining }); break; }
      } else { segments.push({ t: "text", v: remaining }); break; }
    }
    if (!segments.length) segments.push({ t: "text", v: text });
    return segments.map((p, i) =>
      p.t === "link"
        ? <a key={i} href={p.url} target="_blank" rel="noopener noreferrer"
            style={{ color: C.blue, textDecoration: "underline", wordBreak: "break-word" }}>{p.label}</a>
        : <span key={i} style={{ whiteSpace: "pre-wrap" }}>{p.v}</span>

  // Download conversation as formatted HTML

        return '<a href="' + url + '" target="_blank" style="color:#1a56a0;text-decoration:underline">' + label + '</a>';
      });
      // Replace bare URLs
      result = result.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, function(m, pre, url) {
        return pre + '<a href="' + url + '" target="_blank" style="color:#1a56a0;text-decoration:underline">' + url + '</a>';
      });

    };

    const convHtml = messages.map(m => {

          <div class="body">${linkify(m.content).split("\n").join("<br/>")}</div>

    const bareUrlRe = /(https?:\/\/[^\s\)\]]+)/g;

      var re2 = new RegExp("(https?:\\/\\/[^\\s\\)\\]]+)", "g");
      while ((lm = re1.exec(m.content)) !== null) {
        if (!allLinks.has(lm[2])) allLinks.set(lm[2], lm[1]);
      }
      while ((lm = re2.exec(m.content)) !== null) {

      }
    });
    const refSection = allLinks.size > 0 ? `
      <div class="refs">
        <h2>🔗 References & Links</h2>

        ).join("")}</ul>
      </div>` : "";

    const html = `<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/>
  <title>BA Mentor Conversation · ${modeName} · ${date}</title>

    .label{font-size:10px;font-family:monospace;font-weight:700;letter-spacing:0.1em;padding:8px 16px 4px;color:#8b6914;text-transform:uppercase;border-bottom:1px solid #f0ece2}

    .body{padding:14px 16px;font-size:14px;line-height:1.85;color:#2a2015}
    .body a{color:#1a56a0;text-decoration:underline}
    .refs{margin-top:40px;padding:24px;background:#fff;border:1px solid #e0d8c0;border-radius:12px}
    .refs h2{font-size:18px;color:#8b6914;margin:0 0 16px;border-bottom:2px solid #c4962a30;padding-bottom:10px}
    .refs ul{margin:0;padding:0;list-style:none}
    .refs li{padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px}
    .refs li a{color:#1a56a0;font-weight:600;text-decoration:none}
    .refs li a:hover{text-decoration:underline}
    .url{font-size:10px;color:#999;font-family:monospace;margin-top:3px;display:block}
    .footer{margin-top:36px;padding-top:14px;border-top:1px solid #e0d8c0;font-size:11px;color:#999;font-family:monospace;text-align:center}
    @media print{body{background:#fff}.page{padding:20px}}
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>📋 BA Mentor Conversation</h1>
    <div class="meta">Mode: ${modeName} · ${date} · ${messages.length} messages · BA Journal Pro</div>
  </div>
  ${convHtml}
  ${refSection}
  <div class="footer">Downloaded from BA Journal Pro · Powered by Claude AI · ${date}</div>
</div>
</body>
</html>`;

    const blob = new Blob([html], { type: "text/html;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ba-mentor-${mode}-${new Date().toISOString().split("T")[0]}.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
        <div>
          <div style={S.sectionTitle}>Ask Your BA Mentor</div>
          <div style={S.sectionSub}>Powered by Claude AI · History saved automatically · {messages.length > 0 ? `${messages.length} messages in history` : "Start a conversation"}</div>
        </div>
        {messages.length > 0 && (
          <div style={{ display: "flex", gap: 8 }}>
            <Btn variant="outline" sm onClick={downloadConversation} style={{ color: C.green, borderColor: C.green + "40", fontSize: 11 }}>

            <Btn variant="outline" sm onClick={() => { setMessages([]); setError(null); try { localStorage.removeItem(CHAT_KEY); } catch {} }} style={{ color: C.red, borderColor: C.red + "40", fontSize: 11 }}>

          </div>

      </div>

      {/* API Key warning */}
      {!localStorage.getItem("ba_api_key") && (

                  </div>
                )}
                {m.role === "user" && m.ts && (

// ─── PERSONAL JOURNAL VIEW ────────────────────────────────────────────────────
function PersonalJournalView({data,update,notify,userName}){
  const [showForm,setShowForm]=useState(false);
  const [selected,setSelected]=useState(null);
  const [filterMood,setFilterMood]=useState("all");
  const [search,setSearch]=useState("");
  const [form,setForm]=useState({title:"",body:"",mood:"focused",wins:"",challenges:"",tomorrow:"",gratitude:"",tags:""});

  const MOODS=[
    {id:"focused",label:"Focused",emoji:"🎯",color:"#4a9fd4"},
    {id:"motivated",label:"Motivated",emoji:"🔥",color:"#e8a030"},
    {id:"proud",label:"Proud",emoji:"⭐",color:"#c4962a"},
    {id:"challenged",label:"Challenged",emoji:"💪",color:"#a04ad4"},
    {id:"tired",label:"Tired",emoji:"😴",color:"#605040"},
    {id:"frustrated",label:"Frustrated",emoji:"😤",color:"#d44a4a"},
    {id:"curious",label:"Curious",emoji:"🔍",color:"#4ad48a"},
    {id:"grateful",label:"Grateful",emoji:"🙏",color:"#e8c97a"},
  ];
  const getMood=id=>MOODS.find(m=>m.id===id)||MOODS[0];
  const entries=data.personalJournal||[];

  const streak=()=>{
    if(!entries.length)return 0;
    let s=0,d=new Date();d.setHours(0,0,0,0);
    for(let i=0;i<60;i++){
      if(entries.some(e=>new Date(e.date).toDateString()===d.toDateString())){s++;d.setDate(d.getDate()-1);}
      else break;
    }
    return s;
  };

  const save=()=>{
    if(!form.title.trim()){notify("Please add a title","error");return;}
    if(!form.body.trim()){notify("Please write something","error");return;}
    const entry={...form,id:Date.now(),date:new Date().toISOString(),tags:form.tags.split(",").map(t=>t.trim()).filter(Boolean)};
    update("personalJournal",[entry,...entries]);
    setForm({title:"",body:"",mood:"focused",wins:"",challenges:"",tomorrow:"",gratitude:"",tags:""});
    setShowForm(false);
    notify("Journal entry saved ✓");
  };

  const del=(id,e)=>{e.stopPropagation();update("personalJournal",entries.filter(en=>en.id!==id));if(selected?.id===id)setSelected(null);notify("Entry deleted");};
  const filtered=entries.filter(e=>(filterMood==="all"||e.mood===filterMood)&&(!search||e.title.toLowerCase().includes(search.toLowerCase())||e.body.toLowerCase().includes(search.toLowerCase())));
  const thisWeek=entries.filter(e=>new Date(e.date)>new Date(Date.now()-7*24*60*60*1000)).length;

  return(
    <div className="fade-in">
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:26,color:C.goldLight,fontWeight:700}}>{userName ? `${userName}'s Journal` : "Personal Journal"}</div>
          <div style={{fontSize:12,color:C.textDim,fontFamily:"'Source Code Pro',monospace",marginTop:3}}>Your private space · Reflect · Grow · Celebrate</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}><ExportBar pageId="personal" data={data}/><Btn onClick={()=>setShowForm(v=>!v)} style={showForm?{background:"transparent",border:`1px solid ${C.border}`,color:C.textMid}:{}}>{showForm?"✕ Cancel":"+ Write Today's Entry"}</Btn></div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:22}}>
        {[
          {label:"Total Entries",value:entries.length,icon:"📖",color:C.gold},
          {label:"This Week",value:thisWeek,icon:"📅",color:C.blue},
          {label:"Day Streak",value:streak(),icon:"🔥",color:C.orange},
          {label:"Moods Logged",value:[...new Set(entries.map(e=>e.mood))].length,icon:"🎭",color:C.purple},
        ].map(s=>(
          <div key={s.label} style={{...S.card,textAlign:"center",padding:"14px 10px"}}>
            <div style={{fontSize:22,marginBottom:5}}>{s.icon}</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:s.color,fontWeight:700}}>{s.value}</div>
            <div style={{fontSize:10,color:C.textDim,fontFamily:"'Source Code Pro',monospace",marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Form */}
      {showForm&&(
        <div className="fade-in" style={{...S.card,borderColor:C.borderHov,marginBottom:22,background:"#13110f"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:C.goldLight,marginBottom:18}}>
            ✍️ {new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10.5,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:6,letterSpacing:"0.08em"}}>ENTRY TITLE</div>
            <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="What's the theme of today?"
              style={{...S.input,fontSize:14,padding:"11px 14px"}}/>
          </div>
          {/* Mood picker */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10.5,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:8,letterSpacing:"0.08em"}}>HOW ARE YOU FEELING?</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {MOODS.map(m=>(
                <button key={m.id} onClick={()=>setForm(f=>({...f,mood:m.id}))}
                  style={{background:form.mood===m.id?m.color+"22":"transparent",border:`1px solid ${form.mood===m.id?m.color:"#252220"}`,borderRadius:20,padding:"6px 14px",fontFamily:"'Source Code Pro',monospace",fontSize:11,color:form.mood===m.id?m.color:C.textDim,cursor:"pointer",display:"flex",alignItems:"center",gap:5,transition:"all 0.15s"}}>
                  {m.emoji} {m.label}
                </button>
              ))}
            </div>
          </div>
          {/* Main body */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10.5,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:6,letterSpacing:"0.08em"}}>TODAY'S JOURNAL</div>
            <textarea value={form.body} onChange={e=>setForm(f=>({...f,body:e.target.value}))} rows={6}
              placeholder="Write freely... What happened today? What did you learn? How did it feel? What conversations stood out? What are you proud of?"
              style={{...S.textarea,lineHeight:1.75,fontSize:13.5}}/>
          </div>
          {/* 4 columns */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            {[
              {key:"wins",label:"⭐ TODAY'S WINS",placeholder:"What went well? Any victories, big or small?",color:C.gold},
              {key:"challenges",label:"💪 CHALLENGES",placeholder:"What was tough? What would you do differently?",color:C.purple},
              {key:"tomorrow",label:"🎯 TOMORROW'S #1 FOCUS",placeholder:"What's the most important thing tomorrow?",color:C.blue},
              {key:"gratitude",label:"🙏 GRATITUDE",placeholder:"What are you grateful for today?",color:C.green},
            ].map(f=>(
              <div key={f.key}>
                <div style={{fontSize:10.5,color:f.color,fontFamily:"'Source Code Pro',monospace",marginBottom:6,letterSpacing:"0.06em",fontWeight:600}}>{f.label}</div>
                <textarea value={form[f.key]} onChange={e=>setForm(ff=>({...ff,[f.key]:e.target.value}))} rows={3}
                  placeholder={f.placeholder}
                  style={{...S.textarea,fontSize:12,lineHeight:1.6,borderColor:f.color+"30"}}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:10.5,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:6,letterSpacing:"0.08em"}}>TAGS (comma separated)</div>
            <input value={form.tags} onChange={e=>setForm(f=>({...f,tags:e.target.value}))} placeholder="work, learning, personal, ba, health..."
              style={{...S.input}}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Btn onClick={save}>Save Entry</Btn>
            <Btn variant="outline" onClick={()=>setShowForm(false)}>Cancel</Btn>
          </div>
        </div>
      )}

      {/* Filters */}
      <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search your journal..."
          style={{...S.input,flex:1,minWidth:200}}/>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          <Btn variant="outline" sm onClick={()=>setFilterMood("all")} style={{borderColor:filterMood==="all"?C.gold:C.border,color:filterMood==="all"?C.goldLight:C.textDim,background:filterMood==="all"?"#1e1a08":"transparent"}}>All</Btn>
          {MOODS.map(m=><Btn key={m.id} variant="outline" sm onClick={()=>setFilterMood(m.id)} style={{borderColor:filterMood===m.id?m.color:C.border,color:filterMood===m.id?m.color:C.textDim,background:filterMood===m.id?m.color+"15":"transparent"}}>{m.emoji}</Btn>)}
        </div>
      </div>

      {/* Entries */}
      {filtered.length===0?(
        <div style={{...S.card,textAlign:"center",padding:60}}>
          <div style={{fontSize:48,marginBottom:14}}>📔</div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:C.textMid,marginBottom:6}}>{entries.length===0?"Your journal awaits":"No entries match"}</div>
          <div style={{fontSize:12,color:C.textFaint,fontFamily:"'Source Code Pro',monospace"}}>{entries.length===0?"Start capturing your daily journey. Every word matters.":"Try adjusting your filters."}</div>
        </div>
      ):(
        <div style={{display:"grid",gap:12}}>
          {filtered.map(entry=>{
            const mood=getMood(entry.mood);
            const isOpen=selected?.id===entry.id;
            return(
              <div key={entry.id} onClick={()=>setSelected(isOpen?null:entry)}
                style={{background:isOpen?"#1a1610":C.bgCard,border:`1px solid ${isOpen?C.borderHov:C.border}`,borderLeft:`4px solid ${mood.color}`,borderRadius:10,cursor:"pointer",transition:"all 0.2s",overflow:"hidden"}}>
                <div style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:44,height:44,borderRadius:12,background:mood.color+"15",border:`1px solid ${mood.color}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{mood.emoji}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:C.text,marginBottom:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{entry.title}</div>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:10.5,color:C.textDim,fontFamily:"'Source Code Pro',monospace"}}>{new Date(entry.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</span>

                  </div>

                {isOpen&&(
                  <div className="fade-in" style={{borderTop:`1px solid ${C.border}`,padding:"18px 20px 20px"}}>
                    <div style={{fontSize:13.5,color:"#c0b8a8",lineHeight:1.85,whiteSpace:"pre-wrap",marginBottom:(entry.wins||entry.challenges||entry.tomorrow||entry.gratitude)?20:0}}>{entry.body}</div>

                        {[
                          {key:"wins",label:"⭐ Wins",color:C.gold},

          })}

      )}
    </div>
  );
