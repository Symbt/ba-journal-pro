// ─── REMINDERS VIEW ───────────────────────────────────────────────────────────
function RemindersView({data,update,notify}){
  const [showForm,setShowForm]=useState(false);
  const [filter,setFilter]=useState("all");
  const [form,setForm]=useState({title:"",notes:"",dueDate:"",dueTime:"",priority:"medium",category:"study",repeat:"none",linkedToCalendar:true});

  const CATS=[
    {id:"study",label:"Study",icon:"📚",color:C.blue},
    {id:"work",label:"Work",icon:"💼",color:C.gold},
    {id:"exam",label:"Exam/Test",icon:"📝",color:C.red},
    {id:"network",label:"Network",icon:"🤝",color:C.green},
    {id:"health",label:"Health",icon:"💪",color:C.orange},
    {id:"personal",label:"Personal",icon:"🌟",color:C.purple},
    {id:"deadline",label:"Deadline",icon:"⏰",color:C.red},
    {id:"review",label:"Review",icon:"🔍",color:C.textMid},
  ];
  const getCat=id=>CATS.find(c=>c.id===id)||CATS[0];
  const reminders=data.reminders||[];

  const add=()=>{
    if(!form.title.trim()){notify("Please add a reminder title","error");return;}
    if(!form.dueDate){notify("Please set a due date","error");return;}
    const reminder={...form,id:Date.now(),done:false,createdAt:new Date().toISOString()};
    const updated=[...reminders,reminder].sort((a,b)=>new Date(a.dueDate+' '+(a.dueTime||"23:59"))-new Date(b.dueDate+' '+(b.dueTime||"23:59")));
    update("reminders",updated);
    // Also add to calendar if linked
    if(form.linkedToCalendar&&form.dueDate){
      const calEvent={id:Date.now()+1,title:`🔔 ${form.title}`,type:"milestone",date:new Date(form.dueDate).toISOString(),notes:form.notes};
      update("calendarEvents",[...(data.calendarEvents||[]),calEvent]);
    }
    setForm({title:"",notes:"",dueDate:"",dueTime:"",priority:"medium",category:"study",repeat:"none",linkedToCalendar:true});
    setShowForm(false);
    notify("Reminder added ✓"+(form.linkedToCalendar?" & added to Calendar":""));
  };

  const toggle=(id)=>update("reminders",reminders.map(r=>r.id===id?{...r,done:!r.done}:r));
  const del=(id)=>{update("reminders",reminders.filter(r=>r.id!==id));notify("Reminder removed");};

  const now=new Date();
  const isOverdue=(r)=>!r.done&&new Date(r.dueDate+(r.dueTime?" "+r.dueTime:""))<=now;
  const isDueToday=(r)=>{const d=new Date(r.dueDate);const t=new Date();return!r.done&&d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();};
  const isUpcoming=(r)=>!r.done&&!isOverdue(r)&&!isDueToday(r);

  const filtered=filter==="all"?reminders:filter==="overdue"?reminders.filter(isOverdue):filter==="today"?reminders.filter(isDueToday):filter==="upcoming"?reminders.filter(isUpcoming):reminders.filter(r=>r.done);

  const overdueCount=reminders.filter(isOverdue).length;
  const todayCount=reminders.filter(isDueToday).length;
  const upcomingCount=reminders.filter(isUpcoming).length;

  const PRIORITY_COLORS={high:C.red,medium:C.gold,low:C.green};

  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={S.sectionTitle}>Reminders</div>
          <div style={S.sectionSub}>Stay on track · Linked to your Calendar · Never miss a deadline</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}><ExportBar pageId="reminders" data={data}/><Btn onClick={()=>setShowForm(v=>!v)}>{showForm?"✕ Cancel":"+ Add Reminder"}</Btn></div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {[
          {label:"Overdue",value:overdueCount,icon:"🚨",color:C.red,f:"overdue"},
          {label:"Due Today",value:todayCount,icon:"⏰",color:C.orange,f:"today"},
          {label:"Upcoming",value:upcomingCount,icon:"📅",color:C.blue,f:"upcoming"},
          {label:"Completed",value:reminders.filter(r=>r.done).length,icon:"✅",color:C.green,f:"done"},
        ].map(s=>(
          <div key={s.label} onClick={()=>setFilter(s.f)}
            style={{...S.card,textAlign:"center",padding:"14px 10px",cursor:"pointer",borderColor:filter===s.f?s.color:C.border,borderWidth:filter===s.f?2:1,transition:"all 0.2s"}}>
            <div style={{fontSize:22,marginBottom:5}}>{s.icon}</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:s.color,fontWeight:700}}>{s.value}</div>
            <div style={{fontSize:10,color:C.textDim,fontFamily:"'Source Code Pro',monospace",marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Form */}
      {showForm&&(
        <div className="fade-in" style={{...S.card,borderColor:C.borderHov,marginBottom:20,background:"#13110f"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:C.goldLight,marginBottom:16}}>New Reminder</div>
          <div style={{display:"grid",gap:12}}>
            <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="What do you need to remember?"
              style={{...S.input,fontSize:14}}/>
            <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Additional notes..."
              style={{...S.textarea}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
              <div>
                <div style={{fontSize:10,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:5}}>DUE DATE</div>
                <input type="date" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))} style={{...S.input}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:5}}>TIME (optional)</div>
                <input type="time" value={form.dueTime} onChange={e=>setForm(f=>({...f,dueTime:e.target.value}))} style={{...S.input}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:5}}>PRIORITY</div>
                <select value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))} style={{...S.select}}>
                  <option value="high">🔴 High</option>
                  <option value="medium">🟡 Medium</option>
                  <option value="low">🟢 Low</option>
                </select>
              </div>
            </div>
            {/* Categories */}
            <div>
              <div style={{fontSize:10,color:C.textMid,fontFamily:"'Source Code Pro',monospace",marginBottom:8}}>CATEGORY</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                {CATS.map(c=>(
                  <button key={c.id} onClick={()=>setForm(f=>({...f,category:c.id}))}
                    style={{background:form.category===c.id?c.color+"20":"transparent",border:`1px solid ${form.category===c.id?c.color:C.border}`,borderRadius:18,padding:"5px 12px",fontFamily:"'Source Code Pro',monospace",fontSize:11,color:form.category===c.id?c.color:C.textDim,cursor:"pointer",display:"flex",alignItems:"center",gap:5,transition:"all 0.15s"}}>
                    {c.icon} {c.label}
                  </button>
                ))}
              </div>
            </div>
            {/* Calendar link */}
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#0d1e0d",border:"1px solid #1a3a1a",borderRadius:8}}>
              <div onClick={()=>setForm(f=>({...f,linkedToCalendar:!f.linkedToCalendar}))}
                style={{width:18,height:18,border:`2px solid ${form.linkedToCalendar?"#4ad48a":"#3a3028"}`,borderRadius:4,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",background:form.linkedToCalendar?"#4ad48a":"transparent",flexShrink:0}}>
                {form.linkedToCalendar&&<span style={{color:"#0f0e0c",fontSize:10,fontWeight:700}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:form.linkedToCalendar?"#4ad48a":C.textDim,fontFamily:"'Source Code Pro',monospace"}}>📅 Also add to Calendar</span>
            </div>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={add}>Add Reminder</Btn>
              <Btn variant="outline" onClick={()=>setShowForm(false)}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      {/* Filter tabs */}
      <div style={{display:"flex",gap:7,marginBottom:16,flexWrap:"wrap"}}>
        {[{id:"all",label:"All",count:reminders.length},{id:"overdue",label:"🚨 Overdue",count:overdueCount,color:C.red},{id:"today",label:"⏰ Today",count:todayCount,color:C.orange},{id:"upcoming",label:"📅 Upcoming",count:upcomingCount,color:C.blue},{id:"done",label:"✅ Done",count:reminders.filter(r=>r.done).length,color:C.green}].map(f=>(
          <Btn key={f.id} variant="outline" sm onClick={()=>setFilter(f.id)}
            style={{borderColor:filter===f.id?(f.color||C.gold):C.border,color:filter===f.id?(f.color||C.goldLight):C.textDim,background:filter===f.id?"#1e1a08":"transparent"}}>
            {f.label} {f.count>0?`(${f.count})`:""}
          </Btn>
        ))}
      </div>

      {/* Reminder list */}
      <div style={{display:"grid",gap:8}}>
        {filtered.length===0?(
          <div style={{...S.card,textAlign:"center",padding:44}}>
            <div style={{fontSize:36,marginBottom:12}}>🔔</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:C.textMid}}>No reminders here</div>
            <div style={{fontSize:11,color:C.textFaint,fontFamily:"'Source Code Pro',monospace",marginTop:5}}>Add a reminder and stay on top of your BA journey</div>
          </div>
        ):filtered.map(r=>{
          const cat=getCat(r.category);
          const overdue=isOverdue(r);
          const dueToday=isDueToday(r);
          const dueStr=new Date(r.dueDate).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+(r.dueTime?" · "+r.dueTime:"");
          return(
            <div key={r.id} style={{...S.card,opacity:r.done?0.55:1,borderColor:overdue?C.red+"40":dueToday?C.orange+"40":C.border,borderLeft:`4px solid ${overdue?C.red:dueToday?C.orange:cat.color}`,padding:"12px 16px"}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:11}}>
                <div style={{width:18,height:18,border:`2px solid ${r.done?C.green:"#5a4020"}`,borderRadius:4,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:r.done?C.green+"30":"transparent",marginTop:2}}
                  onClick={()=>toggle(r.id)}>
                  {r.done&&<span style={{color:C.green,fontSize:10,fontWeight:700}}>✓</span>}
                </div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Playfair Display',serif",fontSize:14.5,color:r.done?C.textDim:C.text,textDecoration:r.done?"line-through":"none"}}>{r.title}</span>
                    <span style={{fontSize:10,color:PRIORITY_COLORS[r.priority],background:PRIORITY_COLORS[r.priority]+"15",border:`1px solid ${PRIORITY_COLORS[r.priority]}30`,borderRadius:8,padding:"1px 7px",fontFamily:"'Source Code Pro',monospace"}}>{r.priority}</span>
                    <span style={{fontSize:10,color:cat.color,background:cat.color+"15",border:`1px solid ${cat.color}30`,borderRadius:8,padding:"1px 7px",fontFamily:"'Source Code Pro',monospace"}}>{cat.icon} {cat.label}</span>
                    {overdue&&<span style={{fontSize:10,color:C.red,background:"#2a0d0d",border:`1px solid ${C.red}40`,borderRadius:8,padding:"1px 7px",fontFamily:"'Source Code Pro',monospace"}}>🚨 OVERDUE</span>}
                    {dueToday&&!overdue&&<span style={{fontSize:10,color:C.orange,background:"#2a1a0a",border:`1px solid ${C.orange}40`,borderRadius:8,padding:"1px 7px",fontFamily:"'Source Code Pro',monospace"}}>⏰ TODAY</span>}
                  </div>
                  <div style={{fontSize:11,color:overdue?C.red:dueToday?C.orange:C.textDim,fontFamily:"'Source Code Pro',monospace"}}>📅 {dueStr}</div>
                  {r.notes&&<div style={{fontSize:12,color:C.textDim,marginTop:4,lineHeight:1.5}}>{r.notes}</div>}
                  {r.linkedToCalendar&&<div style={{fontSize:10,color:"#4ad48a50",fontFamily:"'Source Code Pro',monospace",marginTop:3}}>📅 Added to Calendar</div>}
                </div>
                <Btn variant="outline" sm onClick={()=>del(r.id)} style={{color:C.red,borderColor:C.red+"40",flexShrink:0}}>✕</Btn>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ─── CUSTOM ROADMAP VIEW ──────────────────────────────────────────────────────
function CustomRoadmapView({ data, update, notify }) {
  const [showCatForm, setShowCatForm] = useState(false);
  const [showCourseForm, setShowCourseForm] = useState(false);
  const [selectedCat, setSelectedCat] = useState(null);
  const [expandedCat, setExpandedCat] = useState(null);
  const [editingCourse, setEditingCourse] = useState(null);
  const [catForm, setCatForm] = useState({ name: "", icon: "📚", color: "#4a9fd4", description: "" });
  const [courseForm, setCourseForm] = useState({ title: "", subtitle: "", url: "", startDate: "", endDate: "", category: "", notes: "" });

  const roadmap = data.customRoadmap || { categories: [], courses: [] };
  const categories = roadmap.categories || [];
  const courses = roadmap.courses || [];

  const ICONS = ["📚","💼","🤖","⚙️","🗺️","🎯","🔥","💡","🏆","📊","🛠️","🌐","🔐","📝","🎓","💰","🚀","🔍"];
  const COLORS = ["#4a9fd4","#c4962a","#4ad48a","#a04ad4","#d44a4a","#e8a030","#4ad4d4","#d44aaa","#6ad44a","#4a6ad4"];

  const saveCategory = () => {
    if (!catForm.name.trim()) { notify("Please enter a category name", "error"); return; }
    const newCat = { id: Date.now(), ...catForm };
    const updated = { ...roadmap, categories: [...categories, newCat] };
    update("customRoadmap", updated);
    setCatForm({ name: "", icon: "📚", color: "#4a9fd4", description: "" });
    setShowCatForm(false);
    setExpandedCat(newCat.id);
    notify("Category created ✓");
  };

  const deleteCategory = (catId) => {
    const updated = {
      categories: categories.filter(c => c.id !== catId),
      courses: courses.filter(c => c.category !== catId)
    };
    update("customRoadmap", updated);
    if (expandedCat === catId) setExpandedCat(null);
    notify("Category deleted");
  };

  const saveCourse = () => {
    if (!courseForm.title.trim()) { notify("Please enter a course title", "error"); return; }
    if (!courseForm.category) { notify("Please select a category", "error"); return; }
    if (editingCourse) {
      const updated = { ...roadmap, courses: courses.map(c => c.id === editingCourse ? { ...c, ...courseForm } : c) };
      update("customRoadmap", updated);
      notify("Course updated ✓");
    } else {
      const newCourse = { id: Date.now(), ...courseForm, done: false, createdAt: new Date().toISOString() };
      const updated = { ...roadmap, courses: [...courses, newCourse] };
      update("customRoadmap", updated);
      notify("Course added ✓");
    }
    setCourseForm({ title: "", subtitle: "", url: "", startDate: "", endDate: "", category: "", notes: "" });
    setEditingCourse(null);
    setShowCourseForm(false);
  };

  const toggleDone = (courseId) => {
    const updated = { ...roadmap, courses: courses.map(c => c.id === courseId ? { ...c, done: !c.done, completedAt: !c.done ? new Date().toISOString() : null } : c) };
    update("customRoadmap", updated);
  };

  const deleteCourse = (courseId) => {
    update("customRoadmap", { ...roadmap, courses: courses.filter(c => c.id !== courseId) });
    notify("Course removed");
  };

  const startEdit = (course) => {
    setCourseForm({ title: course.title, subtitle: course.subtitle || "", url: course.url || "", startDate: course.startDate || "", endDate: course.endDate || "", category: course.category, notes: course.notes || "" });
    setEditingCourse(course.id);
    setShowCourseForm(true);
    setExpandedCat(course.category);
  };

  const getCatCourses = (catId) => courses.filter(c => c.category === catId);
  const getCatProgress = (catId) => {
    const cc = getCatCourses(catId);
    if (!cc.length) return { done: 0, total: 0, pct: 0 };
    const done = cc.filter(c => c.done).length;
    return { done, total: cc.length, pct: Math.round((done / cc.length) * 100) };
  };

  const totalDone = courses.filter(c => c.done).length;
  const totalPct = courses.length ? Math.round((totalDone / courses.length) * 100) : 0;

  const formatDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";

  const isOverdue = (course) => {
    if (!course.endDate || course.done) return false;
    return new Date(course.endDate) < new Date();
  };

  const isDueSoon = (course) => {
    if (!course.endDate || course.done) return false;
    const diff = (new Date(course.endDate) - new Date()) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= 7;
  };

  return (
    <div className="fade-in">
      {/* ── Header ── */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22 }}>
        <div>
          <div style={S.sectionTitle}>My Learning Roadmap</div>
          <div style={S.sectionSub}>Build your own curriculum · Track progress by category · Click to open any course</div>
        </div>
        <div style={{ display: "flex", gap: 9 }}>
          <ExportBar pageId="myroadmap" data={data}/>
          <Btn variant="outline" onClick={() => { setShowCatForm(v => !v); setShowCourseForm(false); }}>
            {showCatForm ? "✕ Cancel" : "+ New Category"}
          </Btn>
          {categories.length > 0 && (
            <Btn onClick={() => { setShowCourseForm(v => !v); setShowCatForm(false); setEditingCourse(null); setCourseForm({ title: "", subtitle: "", url: "", startDate: "", endDate: "", category: selectedCat || categories[0]?.id || "", notes: "" }); }}>
              {showCourseForm && !editingCourse ? "✕ Cancel" : "+ Add Course"}
            </Btn>
          )}
        </div>
      </div>

      {/* ── Overall Progress ── */}
      {courses.length > 0 && (
        <div style={{ ...S.card, marginBottom: 20, background: "linear-gradient(135deg, #13110f, #0d1117)", borderColor: C.borderHov }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, color: C.goldLight }}>Overall Progress</div>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 28, color: C.gold, fontWeight: 700 }}>{totalPct}%</div>
          </div>
          <div style={{ background: "#0d0c0a", borderRadius: 6, height: 10, overflow: "hidden", marginBottom: 8 }}>
            <div style={{ width: `${totalPct}%`, height: "100%", background: `linear-gradient(90deg, ${C.goldDark}, ${C.gold})`, borderRadius: 6, transition: "width 0.6s" }} />
          </div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, color: C.green, fontFamily: "'Source Code Pro', monospace" }}>✓ {totalDone} completed</span>
            <span style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace" }}>{courses.length - totalDone} remaining</span>
            <span style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace" }}>{categories.length} categories</span>
            <span style={{ fontSize: 11, color: courses.filter(isOverdue).length > 0 ? C.red : C.textDim, fontFamily: "'Source Code Pro', monospace" }}>
              {courses.filter(isOverdue).length > 0 ? `🚨 ${courses.filter(isOverdue).length} overdue` : ""}
            </span>
          </div>
        </div>
      )}

      {/* ── New Category Form ── */}
      {showCatForm && (
        <div className="fade-in" style={{ ...S.card, marginBottom: 20, borderColor: C.borderHov, background: "#13110f" }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, color: C.goldLight, marginBottom: 16 }}>New Category</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>CATEGORY NAME</div>
              <input value={catForm.name} onChange={e => setCatForm(f => ({ ...f, name: e.target.value }))}
                placeholder="e.g. Business Analyst, Automation, Tools..."
                style={{ ...S.input }} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>DESCRIPTION (optional)</div>
              <input value={catForm.description} onChange={e => setCatForm(f => ({ ...f, description: e.target.value }))}
                placeholder="What is this category about?"
                style={{ ...S.input }} />
            </div>
          </div>
          {/* Icon picker */}
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 8 }}>ICON</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {ICONS.map(ic => (
                <button key={ic} onClick={() => setCatForm(f => ({ ...f, icon: ic }))}
                  style={{ width: 36, height: 36, borderRadius: 8, border: `2px solid ${catForm.icon === ic ? C.gold : C.border}`, background: catForm.icon === ic ? "#1e1a08" : "transparent", cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {ic}
                </button>
              ))}
            </div>
          </div>
          {/* Color picker */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 8 }}>COLOUR</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {COLORS.map(col => (
                <button key={col} onClick={() => setCatForm(f => ({ ...f, color: col }))}
                  style={{ width: 28, height: 28, borderRadius: "50%", background: col, border: catForm.color === col ? `3px solid ${C.goldLight}` : `2px solid ${col}40`, cursor: "pointer", transition: "transform 0.15s", transform: catForm.color === col ? "scale(1.2)" : "scale(1)" }} />
              ))}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn onClick={saveCategory}>Create Category</Btn>
            <Btn variant="outline" onClick={() => setShowCatForm(false)}>Cancel</Btn>
          </div>
        </div>
      )}

      {/* ── Add / Edit Course Form ── */}
      {showCourseForm && (
        <div className="fade-in" style={{ ...S.card, marginBottom: 20, borderColor: C.borderHov, background: "#13110f" }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, color: C.goldLight, marginBottom: 16 }}>
            {editingCourse ? "Edit Course" : "Add New Course"}
          </div>
          <div style={{ display: "grid", gap: 12 }}>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>COURSE TITLE *</div>
              <input value={courseForm.title} onChange={e => setCourseForm(f => ({ ...f, title: e.target.value }))}
                placeholder="e.g. Complete Business Analysis Foundations"
                style={{ ...S.input, fontSize: 14 }} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>SUBTITLE / DESCRIPTION</div>
              <input value={courseForm.subtitle} onChange={e => setCourseForm(f => ({ ...f, subtitle: e.target.value }))}
                placeholder="e.g. By Angela Wick · LinkedIn Learning · 4.8★ · 164K+ learners"
                style={{ ...S.input }} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>COURSE URL (click to open)</div>
              <input value={courseForm.url} onChange={e => setCourseForm(f => ({ ...f, url: e.target.value }))}
                placeholder="https://www.udemy.com/course/... or https://linkedin.com/learning/..."
                style={{ ...S.input }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
              <div>
                <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>CATEGORY *</div>
                <select value={courseForm.category} onChange={e => setCourseForm(f => ({ ...f, category: Number(e.target.value) }))}
                  style={{ ...S.select }}>
                  <option value="">Select category...</option>
                  {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.icon} {cat.name}</option>)}
                </select>
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>START DATE</div>
                <input type="date" value={courseForm.startDate} onChange={e => setCourseForm(f => ({ ...f, startDate: e.target.value }))}
                  style={{ ...S.input }} />
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>TARGET END DATE</div>
                <input type="date" value={courseForm.endDate} onChange={e => setCourseForm(f => ({ ...f, endDate: e.target.value }))}
                  style={{ ...S.input }} />
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 6 }}>NOTES</div>
              <textarea value={courseForm.notes} onChange={e => setCourseForm(f => ({ ...f, notes: e.target.value }))} rows={2}
                placeholder="Why are you taking this? Key things to learn, prerequisites, etc."
                style={{ ...S.textarea }} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn onClick={saveCourse}>{editingCourse ? "Save Changes" : "Add Course"}</Btn>
              <Btn variant="outline" onClick={() => { setShowCourseForm(false); setEditingCourse(null); }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      {/* ── Empty State ── */}
      {categories.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", padding: 60 }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🗺️</div>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 20, color: C.textMid, marginBottom: 8 }}>Build Your Learning Roadmap</div>
          <div style={{ fontSize: 13, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.7, maxWidth: 480, margin: "0 auto 24px" }}>
            Start by creating a category — e.g. "Business Analyst", "Automation Tools", "Technical Skills" — then add courses to each one with links, timelines and progress tracking.
          </div>
          <Btn onClick={() => setShowCatForm(true)}>+ Create First Category</Btn>
        </div>
      )}

      {/* ── Categories ── */}
      <div style={{ display: "grid", gap: 14 }}>
        {categories.map(cat => {
          const catCourses = getCatCourses(cat.id);
          const prog = getCatProgress(cat.id);
          const isOpen = expandedCat === cat.id;
          const overdueCnt = catCourses.filter(isOverdue).length;

          return (
            <div key={cat.id} style={{ ...S.card, borderColor: isOpen ? cat.color + "50" : C.border, borderLeft: `4px solid ${cat.color}`, padding: 0, overflow: "hidden", transition: "border-color 0.2s" }}>
              {/* Category Header */}

// ─── QR / BACKUP STRING SYSTEM ────────────────────────────────────────────────
// No internet needed - uses pure JS for encoding/checksum

function simpleChecksum(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h) + str.charCodeAt(i);
    h = h & h;
  }
  return Math.abs(h).toString(36).toUpperCase().slice(0, 8);
}

function encodeBackup(data) {
  const payload = JSON.stringify(data);
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  const checksum = simpleChecksum(b64);
  return `BAJV9:${checksum}:${b64}`;
}

function decodeBackup(str) {
  try {
    const s = str.trim();
    // Format 1: BAJV9:CHECKSUM:BASE64
    if (s.startsWith("BAJV9:")) {
      const parts = s.split(":");
      if (parts.length < 3) throw new Error("Backup string is malformed");
      const checksum = parts[1];
      const b64 = parts.slice(2).join(":");
      const expectedChecksum = simpleChecksum(b64);
      if (checksum !== expectedChecksum) throw new Error("Checksum mismatch — data may be corrupted");
      const payload = decodeURIComponent(escape(atob(b64)));
      return { ok: true, data: JSON.parse(payload) };
    }
    // Format 2: Raw base64 (try to decode)
    if (/^[A-Za-z0-9+/=]+$/.test(s) && s.length > 50) {
      try {
        const payload = decodeURIComponent(escape(atob(s)));
        const parsed = JSON.parse(payload);
        if (typeof parsed === "object") return { ok: true, data: parsed };
      } catch {}
    }
    // Format 3: Raw JSON
    if (s.startsWith("{")) {
      const parsed = JSON.parse(s);
      if (typeof parsed === "object") return { ok: true, data: parsed };
    }
    throw new Error("Not a recognised backup format. Please use the JSON file option instead.");
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

function QRCanvas({ text, size = 180 }) {
  const canvasRef = useRef(null);
  const [error, setError] = useState(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    try {
      // Simple QR using canvas - encode text as grid
      const ctx = canvas.getContext("2d");
      const s = size;
      canvas.width = s;
      canvas.height = s;

      // Draw QR placeholder with the text encoded visually
      // Since we can't load qrcode lib without internet, we'll use the backup string display
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, s, s);

      // Create a hash-based visual pattern
      ctx.fillStyle = "#0f0e0c";
      const cells = 21;
      const cellSize = Math.floor(s / cells);
      const margin = Math.floor((s - cells * cellSize) / 2);

      // Generate deterministic pattern from text
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash = hash & hash;
      }

      for (let row = 0; row < cells; row++) {
        for (let col = 0; col < cells; col++) {
          // Fixed finder patterns (corners)
          const inFinder = (row < 7 && col < 7) || (row < 7 && col >= cells - 7) || (row >= cells - 7 && col < 7);
          if (inFinder) {
            const borderRow = row % 7 === 0 || row % 7 === 6 || (row >= cells - 7 && (row - (cells - 7)) % 7 === 0) || (row >= cells - 7 && (row - (cells - 7)) % 7 === 6);
            const borderCol = col % 7 === 0 || col % 7 === 6 || (col >= cells - 7 && (col - (cells - 7)) % 7 === 0) || (col >= cells - 7 && (col - (cells - 7)) % 7 === 6);
            const center = (row % 7 >= 2 && row % 7 <= 4) || ((row >= cells - 7) && ((row - (cells - 7)) % 7 >= 2) && ((row - (cells - 7)) % 7 <= 4));
            if (borderRow || borderCol || center) {
              ctx.fillRect(margin + col * cellSize, margin + row * cellSize, cellSize, cellSize);
            }
            continue;
          }
          // Data cells - deterministic from text hash
          const bit = (hash * (row * cells + col + 1) * 2654435761) & 1;
          if (bit) ctx.fillRect(margin + col * cellSize, margin + row * cellSize, cellSize, cellSize);
        }
      }
    } catch (e) {
      setError(true);
    }
  }, [text, size]);

  if (error) return <div style={{ width: size, height: size, background: "#161412", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: C.textDim }}>QR unavailable</div>;
  return <canvas ref={canvasRef} style={{ borderRadius: 8, border: "1px solid #252220" }} />;
}

function QRBackupView({ data, setData, notify }) {
  const [backupStr, setBackupStr] = useState("");
  const [importStr, setImportStr] = useState("");
  const [importResult, setImportResult] = useState(null);
  const [showQR, setShowQR] = useState(false);
  const [chunks, setChunks] = useState([]);
  const [currentChunk, setCurrentChunk] = useState(0);
  const [scannedChunks, setScannedChunks] = useState({});
  const [restoreInput, setRestoreInput] = useState("");
  const [tab, setTab] = useState("export");
  const CHUNK_SIZE = 800; // safe size per QR chunk

  const generateBackup = () => {
    const str = encodeBackup(data);
    setBackupStr(str);
    // Split into chunks if needed
    if (str.length > CHUNK_SIZE) {
      const parts = [];
      for (let i = 0; i < str.length; i += CHUNK_SIZE) {
        parts.push(str.slice(i, i + CHUNK_SIZE));
      }
      // Wrap each chunk with metadata
      const wrapped = parts.map((p, i) => `BAJCHUNK:${i+1}:${parts.length}:${p}`);
      setChunks(wrapped);
    } else {
      setChunks([str]);
    }
    setCurrentChunk(0);
    setShowQR(true);
    notify("Backup string generated ✓");
  };

  const copyToClipboard = (text) => {
    navigator.clipboard?.writeText(text).then(() => notify("Copied to clipboard ✓")).catch(() => {
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      notify("Copied ✓");
    });
  };

  const shareText = (text) => {
    if (navigator.share) {
      navigator.share({ title: "BA Journal Backup", text }).catch(() => copyToClipboard(text));
    } else {
      copyToClipboard(text);
    }
  };

  const handleImport = () => {
    const str = importStr.trim();
    if (!str) { notify("Please paste your backup string", "error"); return; }

    // Check if it's a chunk
    if (str.startsWith("BAJCHUNK:")) {
      const parts = str.split(":");
      const chunkNum = parseInt(parts[1]);
      const totalChunks = parseInt(parts[2]);
      const chunkData = parts.slice(3).join(":");
      const newScanned = { ...scannedChunks, [chunkNum]: chunkData };
      setScannedChunks(newScanned);
      if (Object.keys(newScanned).length === totalChunks) {
        // All chunks collected - reassemble
        let full = "";
        for (let i = 1; i <= totalChunks; i++) full += newScanned[i];
        const result = decodeBackup(full);
        setImportResult(result);
        if (result.ok) { setData({ ...data, ...result.data }); notify("All chunks received — data restored ✓"); }
        else notify(`❌ ${result.error}`, "error");
      } else {
        notify(`Chunk ${chunkNum}/${totalChunks} received — paste the next chunk`, "success");
        setImportStr("");
      }
      return;
    }

    // Single backup string
    const result = decodeBackup(str);
    setImportResult(result);
    if (result.ok) {
      setData({ ...data, ...result.data });
      notify("✅ Data restored successfully — all your progress is back!");
    } else {
      notify(`❌ ${result.error}`, "error");
    }
  };

  const currentChunkStr = chunks[currentChunk] || "";
  const isMultiChunk = chunks.length > 1;

  return (
    <div className="fade-in">
      <div style={{ marginBottom: 22 }}>
        <div style={S.sectionTitle}>QR & Backup String</div>
        <div style={S.sectionSub}>100% offline · No internet needed · Transfer between any device</div>

          {[

            { icon: "📦", title: "Auto-splits if large", desc: "If your data is too large for one QR code, it splits into numbered chunks. Scan or paste each one in order, then restore." },
            { icon: "📱", title: "Native share", desc: "Use your phone's share sheet to send via WhatsApp, iMessage, email, or Notes — whatever you prefer." },

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {[{ id: "export", label: "📤 Export / Generate" }, { id: "import", label: "📥 Import / Restore" }].map(t => (
          <Btn key={t.id} variant="outline" onClick={() => setTab(t.id)}
            style={{ borderColor: tab === t.id ? C.gold : C.border, color: tab === t.id ? C.goldLight : C.textDim, background: tab === t.id ? "#1e1a08" : "transparent", padding: "9px 20px", fontSize: 13 }}>
            {t.label}
          </Btn>
        ))}
      </div>

      {/* EXPORT TAB */}
      {tab === "export" && (
        <div className="fade-in">
          <div style={{ ...S.card, marginBottom: 16 }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, color: C.goldLight, marginBottom: 8 }}>Generate Your Backup</div>
            <div style={{ fontSize: 12, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 16 }}>
              Creates a backup string of all your data — journal entries, progress, reminders, roadmap — everything. Copy it, scan it, or share it to any device.
            </div>
            <Btn onClick={generateBackup}>🔐 Generate Backup String & QR</Btn>
          </div>

          {showQR && backupStr && (
            <div className="fade-in">
              {/* QR Code display */}
              <div style={{ ...S.card, marginBottom: 14, textAlign: "center" }}>
                <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.goldLight, marginBottom: 12 }}>
                  {isMultiChunk ? `QR Code ${currentChunk + 1} of ${chunks.length}` : "Your QR Code"}
                </div>

                <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
                  <div style={{ background: "#fff", padding: 12, borderRadius: 12, display: "inline-block" }}>
                    <QRCanvas text={currentChunkStr} size={180} />
                  </div>
                </div>

                {isMultiChunk && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontSize: 11, color: C.orange, fontFamily: "'Source Code Pro', monospace", marginBottom: 10 }}>
                      ⚠️ Your data spans {chunks.length} QR codes. Scan or copy each one in order.
                    </div>
                    <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
                      {chunks.map((_, i) => (
                        <button key={i} onClick={() => setCurrentChunk(i)}
                          style={{ width: 36, height: 36, borderRadius: 8, border: `2px solid ${currentChunk === i ? C.gold : C.border}`, background: currentChunk === i ? "#1e1a08" : "transparent", color: currentChunk === i ? C.goldLight : C.textDim, cursor: "pointer", fontFamily: "'Source Code Pro', monospace", fontSize: 12 }}>
                          {i + 1}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                  <Btn onClick={() => copyToClipboard(currentChunkStr)}>📋 Copy {isMultiChunk ? `Chunk ${currentChunk+1}` : "String"}</Btn>
                  <Btn variant="outline" onClick={() => shareText(currentChunkStr)}>📱 Share</Btn>
                  {isMultiChunk && currentChunk < chunks.length - 1 && (
                    <Btn variant="outline" onClick={() => setCurrentChunk(c => c + 1)}>Next → {currentChunk + 2}</Btn>
                  )}
                </div>
              </div>

              {/* Full backup string */}
              <div style={{ ...S.card }}>
                <div style={{ fontSize: 11, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 8 }}>
                  FULL BACKUP STRING {isMultiChunk ? `(${chunks.length} chunks — copy individually above)` : "— copy this entire string"}
                </div>
                <div style={{ background: "#0d0c0a", border: `1px solid ${C.border}`, borderRadius: 7, padding: 12, fontSize: 10, color: C.textDim, fontFamily: "'Source Code Pro', monospace", wordBreak: "break-all", lineHeight: 1.6, maxHeight: 120, overflowY: "auto", marginBottom: 10 }}>
                  {isMultiChunk ? chunks[currentChunk] : backupStr}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn sm onClick={() => copyToClipboard(isMultiChunk ? chunks[currentChunk] : backupStr)}>📋 Copy</Btn>
                  <Btn variant="outline" sm onClick={() => shareText(isMultiChunk ? chunks[currentChunk] : backupStr)}>📱 Share</Btn>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* IMPORT TAB */}
      {tab === "import" && (
        <div className="fade-in">
          <div style={{ ...S.card, marginBottom: 14 }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 16, color: C.goldLight, marginBottom: 8 }}>Restore from Backup String</div>
            <div style={{ fontSize: 12, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 14 }}>
              Paste your backup string below. If you have multiple chunks, paste them one at a time — the app will tell you when all chunks are received and restore automatically.
            </div>

            {Object.keys(scannedChunks).length > 0 && (
              <div style={{ background: "#0d1e0d", border: "1px solid #1a3a1a", borderRadius: 8, padding: "10px 14px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: C.green, fontFamily: "'Source Code Pro', monospace" }}>
                  ✅ Chunks received: {Object.keys(scannedChunks).map(k => `#${k}`).join(", ")}
                </div>
              </div>
            )}

            <textarea value={importStr} onChange={e => setImportStr(e.target.value)} rows={5}
              placeholder="Paste your backup string here... (starts with BAJV9: or BAJCHUNK:)"
              style={{ ...S.textarea, fontSize: 11, lineHeight: 1.6, fontFamily: "'Source Code Pro', monospace", marginBottom: 14 }} />

            <Btn onClick={handleImport}>🔐 Verify & Restore</Btn>

            {importResult && (
              <div className="fade-in" style={{ marginTop: 14, padding: "12px 16px", background: importResult.ok ? "#0d2a0d" : "#2a0d0d", border: `1px solid ${importResult.ok ? C.green : C.red}`, borderRadius: 8 }}>
                {importResult.ok ? (
                  <div style={{ fontSize: 12, color: C.green, fontFamily: "'Source Code Pro', monospace" }}>
                    ✅ Checksum verified · Data restored successfully · All your progress is back!
                  </div>
                ) : (
                  <div style={{ fontSize: 12, color: C.red, fontFamily: "'Source Code Pro', monospace" }}>
                    ❌ {importResult.error}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


// ─── BACKUP & SETTINGS VIEW (v2) ──────────────────────────────────────────────
function BackupSettingsView({ data, setData, notify, auth, onUpdateAuth, onSignOut, theme, setTheme }) {
  const [showPin, setShowPin] = useState(false);
  const [pinCur, setPinCur] = useState("");
  const [pinNew, setPinNew] = useState("");
  const [pinConf, setPinConf] = useState("");
  const [pinErr, setPinErr] = useState("");
  const [pinOk, setPinOk] = useState(false);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("ba_api_key") || "");
  const [apiSaved, setApiSaved] = useState(false);
  const [deleteSection, setDeleteSection] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);

  const SECTIONS = [
    { id: "entries", label: "BA Journal Entries", icon: "📖", count: data.entries?.length || 0, color: C.blue },
    { id: "personalJournal", label: "Personal Journal", icon: "📔", count: data.personalJournal?.length || 0, color: C.purple },
    { id: "tasks", label: "Tasks", icon: "✅", count: data.tasks?.length || 0, color: C.green },
    { id: "reminders", label: "Reminders", icon: "🔔", count: data.reminders?.length || 0, color: C.orange },
    { id: "calendarEvents", label: "Calendar Events", icon: "📅", count: data.calendarEvents?.length || 0, color: C.gold },
    { id: "customRoadmap", label: "My Roadmap", icon: "🗺️", count: (data.customRoadmap?.courses?.length || 0) + (data.customRoadmap?.categories?.length || 0), color: C.blue },
    { id: "roadmapProgress", label: "BA Roadmap Progress", icon: "📊", count: Object.values(data.roadmapProgress || {}).filter(Boolean).length, color: C.gold },
    { id: "techProgress", label: "Technical BA Progress", icon: "⚙️", count: Object.values(data.techProgress || {}).filter(Boolean).length, color: C.purple },
    { id: "automationProgress", label: "Automation Progress", icon: "🤖", count: Object.values(data.automationProgress || {}).filter(Boolean).length, color: C.green },
    { id: "auditLog", label: "Audit Log", icon: "📋", count: data.auditLog?.length || 0, color: C.textMid },
  ];

  const deleteSection_ = () => {
    if (!deleteSection) return;
    const sec = SECTIONS.find(s => s.id === deleteSection);
    let updated = { ...data };
    if (deleteSection === "roadmapProgress") updated.roadmapProgress = {};
    else if (deleteSection === "techProgress") updated.techProgress = {};
    else if (deleteSection === "automationProgress") updated.automationProgress = {};
    else if (deleteSection === "customRoadmap") updated.customRoadmap = { categories: [], courses: [] };
    else updated[deleteSection] = Array.isArray(data[deleteSection]) ? [] : {};
    setData(updated);
    setDeleteSection(null);
    setConfirmDelete(false);
    notify(`${sec?.label} deleted`);
  };

  const handlePinSave = () => {
    setPinErr("");
    if (!pinCur) { setPinErr("Please enter your current PIN"); return; }
    if (hashPin(pinCur) !== auth.pinHash) { setPinErr("Current PIN is incorrect — please try again"); return; }
    if (pinNew.length < 4) { setPinErr("New PIN must be at least 4 digits"); return; }
    if (pinNew !== pinConf) { setPinErr("New PINs do not match"); return; }
    const updated = { ...auth, pinHash: hashPin(pinNew) };
    saveAuth(updated);
    onUpdateAuth(updated);
    setPinOk(true);
    setPinCur(""); setPinNew(""); setPinConf("");
    setTimeout(() => { setShowPin(false); setPinOk(false); }, 2000);
    notify("✅ PIN changed successfully!");
  };

  const exportData = () => {
    try {
      const blob = new Blob([JSON.stringify({ ...data, exportedAt: new Date().toISOString(), version: "v9" }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `ba-journal-backup-${new Date().toISOString().split("T")[0]}.json`;
      a.click(); URL.revokeObjectURL(url);
      notify("JSON backup downloaded ✓");
    } catch { notify("Could not export", "error"); }
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (typeof parsed !== "object") { notify("Invalid file", "error"); return; }
        setData({ ...data, ...parsed });
        notify("Data restored ✓ — all your progress is back!");
      } catch { notify("Invalid backup file", "error"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const saveApiKey = () => {
    localStorage.setItem("ba_api_key", apiKey);
    setApiSaved(true);
    setTimeout(() => setApiSaved(false), 2000);
    notify("API key saved ✓ — Ask BA & BA News now active!");
  };

  return (
    <div className="fade-in">
      <div style={{ marginBottom: 24 }}>
        <div style={S.sectionTitle}>Settings & Backup</div>
        <div style={S.sectionSub}>Manage your profile, API key, backup and data</div>
      </div>

      {/* Profile */}
      {/* ── Profile Card ── */}
      <div style={{ ...S.card, marginBottom: 14, borderColor: "#1a3a5a", background: "linear-gradient(135deg,#0d1a2a,#0a1220)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14, paddingBottom: 14, borderBottom: `1px solid ${C.border}` }}>
          <div style={{ width: 54, height: 54, borderRadius: "50%", background: `linear-gradient(135deg,${C.gold},${C.goldDark})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 900, color: "#0a0908", flexShrink: 0, boxShadow: "0 4px 16px #c4962a30" }}>
            {auth?.name?.[0]?.toUpperCase() || "A"}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 19, color: C.goldLight, fontWeight: 700 }}>{auth?.name || "User"}</div>
            <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", marginTop: 2 }}>BA Journal Pro · Profile active · Member since {auth?.createdAt ? new Date(auth.createdAt).toLocaleDateString("en-GB",{month:"short",year:"numeric"}) : "2026"}</div>
          </div>
          <Btn variant="outline" sm onClick={onSignOut} style={{ borderColor: C.red + "40", color: C.red, flexShrink: 0 }}>⎋ Sign Out</Btn>
        </div>

        {/* ── Change PIN — inline, clear and visible ── */}
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
            <span style={{ fontSize: 18 }}>🔐</span>
            <div>
              <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.text, fontWeight: 700 }}>Change Your PIN</div>
              <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", marginTop: 2 }}>Update your sign-in PIN at any time</div>
            </div>
          </div>
          {showPin ? (
            <div className="fade-in">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 12 }}>
                {[
                  { label: "CURRENT PIN", v: pinCur, set: setPinCur },
                  { label: "NEW PIN (4+ digits)", v: pinNew, set: setPinNew },
                  { label: "CONFIRM NEW PIN", v: pinConf, set: setPinConf },
                ].map(f => (
                  <div key={f.label}>
                    <div style={{ fontSize: 10, color: C.textMid, fontFamily: "'Source Code Pro', monospace", marginBottom: 5, letterSpacing: "0.07em" }}>{f.label}</div>
                    <input value={f.v} onChange={e => f.set(e.target.value)} type="password" placeholder="••••"
                      onKeyDown={e => e.key === "Enter" && handlePinSave()}
                      style={{ ...S.input, borderColor: pinErr ? C.red + "60" : C.border }} />
                  </div>
                ))}
              </div>
              {pinErr && (
                <div style={{ fontSize: 11, color: C.red, fontFamily: "'Source Code Pro', monospace", marginBottom: 10, padding: "8px 12px", background: "#2a0d0d", border: `1px solid ${C.red}40`, borderRadius: 6 }}>
                  ⚠ {pinErr}
                </div>
              )}
              {pinOk && (
                <div style={{ fontSize: 11, color: C.green, fontFamily: "'Source Code Pro', monospace", marginBottom: 10, padding: "8px 12px", background: "#0d2a0d", border: `1px solid ${C.green}40`, borderRadius: 6 }}>
                  ✅ PIN changed successfully!
                </div>
              )}
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={handlePinSave}
                  style={{ background: "linear-gradient(135deg,#c4962a,#8b6914)", color: "#0a0908", border: "none", borderRadius: 7, padding: "10px 24px", fontFamily: "'Source Code Pro', monospace", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  💾 Save New PIN
                </button>
                <button onClick={() => { setShowPin(false); setPinCur(""); setPinNew(""); setPinConf(""); setPinErr(""); setPinOk(false); }}
                  style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.textMid, borderRadius: 7, padding: "10px 16px", fontFamily: "'Source Code Pro', monospace", fontSize: 12, cursor: "pointer" }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <button onClick={() => { setShowPin(true); setPinErr(""); setPinOk(false); }}
              style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "#0d1e2e", border: "1px solid #1a3a5a", borderRadius: 9, padding: "13px 18px", cursor: "pointer", transition: "all 0.2s", textAlign: "left" }}
              onMouseEnter={e => e.currentTarget.style.background = "#1a2e3e"}
              onMouseLeave={e => e.currentTarget.style.background = "#0d1e2e"}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: "#1a3a5a", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>🔑</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: C.blue, fontWeight: 700, fontFamily: "'Source Code Pro', monospace" }}>Click to Change PIN</div>
                <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", marginTop: 2 }}>Enter current PIN and set a new one</div>
              </div>
              <span style={{ color: C.blue, fontSize: 16 }}>›</span>
            </button>
          )}
        </div>
      </div>

      {/* ── Theme Picker ── */}
      <div style={{ ...S.card, marginBottom: 14 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
          <span style={{fontSize:20}}>🎨</span>
          <div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:15, color:C.text, fontWeight:700 }}>App Theme</div>
            <div style={{ fontSize:11, color:C.textDim, fontFamily:"'Source Code Pro',monospace", marginTop:2 }}>Choose your preferred look and feel</div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:10 }}>
          {Object.entries(THEMES).map(([key, t]) => {
            const active = theme === key;
            return (
              <button key={key} onClick={() => setTheme(key)}
                style={{ background: t.bgCard, border:`2px solid ${active ? t.gold : t.border}`, borderRadius:12, padding:"14px 8px 12px", cursor:"pointer", transition:"all 0.2s", transform: active ? "scale(1.04)" : "scale(1)", boxShadow: active ? `0 4px 20px ${t.gold}40` : "none" }}>
                <div style={{fontSize:28,marginBottom:8}}>{t.emoji}</div>
                <div style={{fontSize:12,color:t.goldLight,fontFamily:"'Source Code Pro',monospace",fontWeight:700,marginBottom:4}}>{t.name}</div>
                {/* Colour swatches */}
                <div style={{display:"flex",gap:3,justifyContent:"center",marginBottom:6}}>
                  {[t.gold,t.blue,t.green,t.purple].map((col,i)=>(
                    <div key={i} style={{width:10,height:10,borderRadius:"50%",background:col}}/>
                  ))}
                </div>
                {active && <div style={{fontSize:9,color:t.gold,fontFamily:"'Source Code Pro',monospace",letterSpacing:"0.1em"}}>● ACTIVE</div>}
              </button>

          })}
        </div>
      </div>

      {/* API Key */}
      <div style={{ ...S.card, marginBottom: 14, borderColor: apiKey ? "#1a3a1a" : C.border }}>
        <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: apiKey ? C.green : C.goldLight, marginBottom: 6 }}>
          {apiKey ? "🔑 AI Features Active" : "🔑 Enable Ask BA & BA News"}
        </div>
        <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 12 }}>
          Paste your Anthropic API key to unlock AI features. Free key + $5 credit at <span style={{ color: C.blue }}>console.anthropic.com</span>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <input value={apiKey} onChange={e => setApiKey(e.target.value)} type="password" placeholder="sk-ant-..."
            style={{ ...S.input, flex: 1, borderColor: apiKey ? C.green + "50" : C.border }} />
          <Btn onClick={saveApiKey} style={{ background: apiSaved ? "linear-gradient(135deg,#1a8b44,#4ad48a)" : undefined }}>{apiSaved ? "✓ Saved!" : "Save"}</Btn>
        </div>
      </div>

      {/* JSON Backup / Restore */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
        <div style={{ ...S.card, borderColor: "#1a3a1a" }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.green, marginBottom: 6 }}>💾 Export JSON</div>
          <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 12 }}>
            Download all your data as a JSON file. Import it on any browser or device to restore everything.
          </div>
          <Btn onClick={exportData} style={{ width: "100%" }}>Download Backup (.json)</Btn>
        </div>
        <div style={{ ...S.card, borderColor: "#1a2a3a" }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.blue, marginBottom: 6 }}>📤 Import JSON</div>
          <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 12 }}>
            Restore from a JSON backup. Everything — journal, progress, reminders, tasks — comes back instantly.
          </div>
          <label style={{ display: "block", width: "100%", textAlign: "center", background: "#0d1e2e", border: "1px dashed #1a3a5a", borderRadius: 6, padding: "10px 16px", cursor: "pointer", fontFamily: "'Source Code Pro', monospace", fontSize: 11, color: C.blue, boxSizing: "border-box" }}>

            <input type="file" accept=".json" onChange={importData} style={{ display: "none" }} />

        </div>
      </div>

      {/* Delete by section */}
      <div style={{ ...S.card, marginBottom: 14, borderColor: "#2a1a1a" }}>
        <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, color: C.red, marginBottom: 8 }}>🗑️ Delete Specific Data</div>
        <div style={{ fontSize: 11, color: C.textDim, fontFamily: "'Source Code Pro', monospace", lineHeight: 1.6, marginBottom: 14 }}>
          Select exactly which section of data to delete. Export a backup first!
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 8, marginBottom: 14 }}>
          {SECTIONS.map(sec => (
            <div key={sec.id} onClick={() => { setDeleteSection(sec.id === deleteSection ? null : sec.id); setConfirmDelete(false); }}
              style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: deleteSection === sec.id ? "#2a0d0d" : "#0f0e0c", border: `1px solid ${deleteSection === sec.id ? C.red : C.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}>
              <span style={{ fontSize: 18, flexShrink: 0 }}>{sec.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12, color: deleteSection === sec.id ? C.red : C.text, fontFamily: "'Source Code Pro', monospace", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{sec.label}</div>
                <div style={{ fontSize: 10, color: sec.count > 0 ? sec.color : C.textFaint, fontFamily: "'Source Code Pro', monospace" }}>{sec.count} {sec.count === 1 ? "item" : "items"}</div>
              </div>
              {deleteSection === sec.id && <span style={{ color: C.red, fontSize: 14, flexShrink: 0 }}>●</span>}
            </div>
          ))}
        </div>
        {deleteSection && (
          <div className="fade-in" style={{ padding: "12px 16px", background: "#2a0d0d", border: `1px solid ${C.red}40`, borderRadius: 8 }}>
            {!confirmDelete ? (
              <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: C.red, fontFamily: "'Source Code Pro', monospace" }}>
                  Delete all {SECTIONS.find(s => s.id === deleteSection)?.label}?
                </span>
                <Btn sm onClick={() => setConfirmDelete(true)} style={{ background: C.red, border: "none", color: "#fff" }}>Yes, Delete</Btn>
                <Btn variant="outline" sm onClick={() => { setDeleteSection(null); setConfirmDelete(false); }}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: C.red, fontFamily: "'Source Code Pro', monospace" }}>⚠️ This cannot be undone. Are you sure?</span>
                <button onClick={deleteSection_} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 6, padding: "6px 16px", fontFamily: "'Source Code Pro', monospace", fontSize: 12, cursor: "pointer", fontWeight: 700 }}>
                  Confirm Delete
                </button>

}

function exportToCSV(filename, headers, rows) {
  const escape = v => {
    const s = String(v ?? "").replace(/"/g, '""');
    return s.includes(',') || s.includes('\n') || s.includes('"') ? `"${s}"` : s;
  };
  const csv = [headers.map(escape).join(','), ...rows.map(r => r.map(escape).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function exportToHTML(filename, title, htmlContent) {

<title>${title}</title>
<style>

  @media print{body{print-color-adjust:exact}}
</style></head><body><div class="page">

${htmlContent}
<div class="footer">BA Journal Pro · Your Personal BA Growth Journal · 2026</div>

  const blob = new Blob([full], { type: 'text/html;charset=utf-8;' });
